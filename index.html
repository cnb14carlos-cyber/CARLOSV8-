<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarlosV8 - Music Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #ffffff; min-height: 100vh; padding-bottom: 100px; display: flex; flex-direction: column; }

    /* Layout Principal */
    .app-container { display: flex; flex: 1; min-height: calc(100vh - 90px); }

    /* Menú Lateral */
    .sidebar {
      width: 240px;
      background-color: #000000;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding: 0 8px; cursor: pointer; }
    .logo-v8 {
      width: 38px; height: 38px; background: #1DB954; color: #000;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 16px;
    }
    .brand-title { color: #ffffff; font-size: 20px; font-weight: 800; }

    .nav-btn {
      background: transparent; border: none; color: #b3b3b3;
      padding: 12px 16px; border-radius: 8px; font-weight: 700; font-size: 14px;
      text-align: left; cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; gap: 14px; width: 100%;
    }
    .nav-btn:hover { color: #ffffff; background-color: #1f1f1f; }
    .nav-btn.active { color: #ffffff; background-color: #282828; }

    /* Panel Principal */
    .main-content { flex: 1; padding: 24px 32px; background: linear-gradient(180deg, #1e1e1e 0%, #121212 300px); overflow-y: auto; }

    /* Buscador Bar */
    .search-bar { display: flex; gap: 12px; max-width: 500px; margin-bottom: 28px; }
    .search-input {
      flex: 1; padding: 12px 20px; border-radius: 50px; border: 1px solid #333;
      background: #242424; color: #fff; font-size: 14px; outline: none;
    }
    .search-input:focus { border-color: #1DB954; }
    .search-btn {
      background: #1DB954; color: #000; border: none; padding: 12px 24px;
      border-radius: 50px; font-weight: bold; cursor: pointer; transition: transform 0.1s, background 0.2s;
    }
    .search-btn:hover { background: #1ed760; transform: scale(1.03); }

    /* Secciones y Rejillas */
    .section-title { font-size: 22px; font-weight: 800; margin: 24px 0 16px 0; color: #ffffff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }

    /* Tarjetas de Música */
    .card {
      background: #181818; padding: 16px; border-radius: 8px; cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    .card:hover { background: #282828; transform: translateY(-4px); }
    .card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; margin-bottom: 12px; background: #282828; display: block; }
    .card-artist-img { border-radius: 50% !important; }
    .card-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .card-sub { font-size: 12px; color: #a7a7a7; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Reproductor Fijo en la parte inferior */
    .player-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 90px;
      background-color: #000000; border-top: 1px solid #282828;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; z-index: 999;
    }
    .track-info { display: flex; align-items: center; gap: 14px; width: 30%; min-width: 180px; }
    .track-info img { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; background: #282828; }
    .track-details h4 { font-size: 14px; font-weight: 600; color: #fff; }
    .track-details p { font-size: 12px; color: #a7a7a7; margin-top: 2px; }

    audio { width: 45%; max-width: 600px; height: 40px; outline: none; }
    .status-msg { color: #a7a7a7; font-size: 14px; padding: 20px 0; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Menú Lateral -->
    <aside class="sidebar">
      <div class="brand" onclick="irA('inicio')">
        <div class="logo-v8">V8</div>
        <div class="brand-title">CarlosV8</div>
      </div>
      <button class="nav-btn active" id="btn-inicio" onclick="irA('inicio')">🏠 Inicio</button>
      <button class="nav-btn" id="btn-buscar" onclick="irA('buscar')">🔍 Buscar</button>
      <button class="nav-btn" id="btn-biblioteca" onclick="irA('biblioteca')">📚 Tu biblioteca</button>
    </aside>

    <!-- Panel Principal -->
    <main class="main-content">
      
      <!-- Seccion 1: INICIO -->
      <section id="sec-inicio">
        <h2 class="section-title">🔥 Canciones más Top</h2>
        <div class="grid" id="top-songs-grid"></div>

        <h2 class="section-title">⭐ Artistas más Top</h2>
        <div class="grid" id="top-artists-grid"></div>
      </section>

      <!-- Seccion 2: BUSCAR -->
      <section id="sec-buscar" style="display: none;">
        <div class="search-bar">
          <input type="text" id="searchInput" class="search-input" placeholder="¿Qué quieres escuchar hoy?" onkeypress="if(event.key==='Enter') ejecutarBusqueda()">
          <button class="search-btn" onclick="ejecutarBusqueda()">Buscar</button>
        </div>
        <h2 class="section-title" id="search-title">Buscar música</h2>
        <div class="grid" id="search-grid">
          <p class="status-msg">Escribe una canción o artista en el buscador para empezar.</p>
        </div>
      </section>

      <!-- Seccion 3: BIBLIOTECA -->
      <section id="sec-biblioteca" style="display: none;">
        <h2 class="section-title">📚 Tu biblioteca</h2>
        <div class="grid" id="library-grid"></div>
      </section>

    </main>
  </div>

  <!-- Barra del Reproductor -->
  <footer class="player-bar">
    <div class="track-info">
      <img id="playerCover" src="" alt="">
      <div class="track-details">
        <h4 id="nowTitle">Selecciona una canción</h4>
        <p id="nowArtist">CarlosV8 Player</p>
      </div>
    </div>
    <audio id="audioPlayer" controls></audio>
  </footer>

  <script>
    // Generador de portadas de respaldo dinámicas estilizadas en Base64 (100% a prueba de fallos)
    function generarCoverSVG(titulo, artista, esArtista = false) {
      const paletas = [
        ['#1DB954', '#121212'],
        ['#833ab4', '#fd1d1d'],
        ['#00c6ff', '#0072ff'],
        ['#f857a6', '#ff5858'],
        ['#7F00FF', '#E100FF'],
        ['#FF416C', '#FF4B2B'],
        ['#11998e', '#38ef7d']
      ];
      let hash = 0;
      const str = titulo + (artista || '');
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      const color = paletas[Math.abs(hash) % paletas.length];

      const iniciales = titulo.trim().split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase() || '🎵';
      const icono = esArtista ? '🎤' : '🎵';

      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${color[0]}"/>
            <stop offset="100%" stop-color="${color[1]}"/>
          </linearGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#g)"/>
        <circle cx="150" cy="130" r="55" fill="rgba(0,0,0,0.25)"/>
        <text x="150" y="145" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">${iniciales}</text>
        <text x="150" y="225" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">${icono}</text>
      </svg>`;

      return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
    }

    // Lista Completa de Canciones Top
    const topCancionesBase = [
      { id: 'c1', title: 'Columbia', artist: 'Quevedo', query: 'Quevedo Columbia' },
      { id: 'c2', title: 'LALA', artist: 'Myke Towers', query: 'Myke Towers LALA' },
      { id: 'c3', title: 'Classy 101', artist: 'Feid & Young Miko', query: 'Feid Classy 101' },
      { id: 'c4', title: 'El Merengue', artist: 'Marshmello & Manuel Turizo', query: 'Marshmello El Merengue' },
      { id: 'c5', title: 'BABY HELLO', artist: 'Rauw Alejandro & Bizarrap', query: 'Rauw Alejandro BABY HELLO' },
      { id: 'c6', title: 'Los del Espacio', artist: 'LIT killah, Duki, Emilia', query: 'LIT killah Los del Espacio' },
      { id: 'c7', title: 'Polaris Remix', artist: 'Saiko, Quevedo, Feid', query: 'Saiko Polaris Remix' },
      { id: 'c8', title: 'CORAZÓN VACÍO', artist: 'Maria Becerra', query: 'Maria Becerra CORAZON VACIO' },
      { id: 'c9', title: 'MONACO', artist: 'Bad Bunny', query: 'Bad Bunny MONACO' },
      { id: 'c10', title: 'LUNA', artist: 'Feid & ATL Jacob', query: 'Feid LUNA' },
      { id: 'c11', title: 'Reina', artist: 'Mora & Saiko', query: 'Mora Reina' },
      { id: 'c12', title: 'Madrid City', artist: 'Ana Mena', query: 'Ana Mena Madrid City' }
    ];

    // Lista Completa de Artistas Top
    const topArtistasBase = [
      { name: 'Quevedo' },
      { name: 'Feid' },
      { name: 'Bad Bunny' },
      { name: 'Myke Towers' },
      { name: 'Rauw Alejandro' },
      { name: 'Saiko' },
      { name: 'Bizarrap' },
      { name: 'Maria Becerra' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('playerCover').src = generarCoverSVG('CarlosV8', 'Music');
      cargarInicio();
    });

    function irA(seccion) {
      document.querySelectorAll('.sidebar .nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${seccion}`).classList.add('active');

      document.getElementById('sec-inicio').style.display = (seccion === 'inicio') ? 'block' : 'none';
      document.getElementById('sec-buscar').style.display = (seccion === 'buscar') ? 'block' : 'none';
      document.getElementById('sec-biblioteca').style.display = (seccion === 'biblioteca') ? 'block' : 'none';

      if (seccion === 'inicio') cargarInicio();
      if (seccion === 'buscar') document.getElementById('searchInput').focus();
      if (seccion === 'biblioteca') cargarBiblioteca();
    }

    // Renderiza la sección de Inicio inmediatamente y busca datos actualizados de iTunes
    function cargarInicio() {
      const songGrid = document.getElementById('top-songs-grid');
      songGrid.innerHTML = '';

      topCancionesBase.forEach(item => {
        const fallbackCover = generarCoverSVG(item.title, item.artist, false);
        const card = crearTarjeta(item.title, item.artist, fallbackCover, '', item.id);
        card.id = `card-song-${item.id}`;
        songGrid.appendChild(card);

        // Obtener la canción y portada real directamente de iTunes
        fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(item.query)}&entity=song&limit=1`)
          .then(r => r.json())
          .then(data => {
            if (data.results && data.results.length > 0) {
              const track = data.results[0];
              const realCover = track.artworkUrl100 ? track.artworkUrl100.replace('100x100bb', '300x300bb') : fallbackCover;
              const imgEl = card.querySelector('img');
              if (imgEl) imgEl.src = realCover;
              card.onclick = () => reproducir(track.previewUrl, track.trackName, track.artistName, realCover, item.id);
            }
          }).catch(() => {});
      });

      const artistGrid = document.getElementById('top-artists-grid');
      artistGrid.innerHTML = '';
      topArtistasBase.forEach((artist, idx) => {
        const fallbackCover = generarCoverSVG(artist.name, 'Artista', true);
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => {
          irA('buscar');
          document.getElementById('searchInput').value = artist.name;
          ejecutarBusqueda();
        };
        card.innerHTML = `
          <img src="${fallbackCover}" class="card-artist-img" alt="" onerror="this.onerror=null;this.src='${fallbackCover}';">
          <div class="card-title" style="text-align:center;">${artist.name}</div>
          <div class="card-sub" style="text-align:center;">Artista</div>
        `;
        artistGrid.appendChild(card);

        // Buscar foto de artista en iTunes
        fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(artist.name)}&entity=song&limit=1`)
          .then(r => r.json())
          .then(data => {
            if (data.results && data.results.length > 0) {
              const realCover = data.results[0].artworkUrl100.replace('100x100bb', '300x300bb');
              const imgEl = card.querySelector('img');
              if (imgEl) imgEl.src = realCover;
            }
          }).catch(() => {});
      });
    }

    async function ejecutarBusqueda() {
      irA('buscar');
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const titleEl = document.getElementById('search-title');
      const gridEl = document.getElementById('search-grid');
      titleEl.innerText = `Resultados para "${query}"`;
      gridEl.innerHTML = '<p class="status-msg">Buscando canciones...</p>';

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);

      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=18`, { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();

        gridEl.innerHTML = '';
        if (!data.results || data.results.length === 0) {
          gridEl.innerHTML = '<p class="status-msg">No se encontraron resultados para esta búsqueda.</p>';
          return;
        }

        data.results.forEach(track => {
          const fallbackCover = generarCoverSVG(track.trackName, track.artistName);
          const coverUrl = track.artworkUrl100 ? track.artworkUrl100.replace('100x100bb', '300x300bb') : fallbackCover;
          gridEl.appendChild(crearTarjeta(track.trackName, track.artistName, coverUrl, track.previewUrl, track.trackId));
        });

      } catch (err) {
        clearTimeout(timeoutId);
        gridEl.innerHTML = '<p class="status-msg" style="color: #ff5555;">No se pudo completar la búsqueda en este momento. Inténtalo de nuevo.</p>';
      }
    }

    function crearTarjeta(title, artist, cover, audioUrl, id) {
      const card = document.createElement('div');
      card.className = 'card';
      const fallback = generarCoverSVG(title, artist);
      card.onclick = () => reproducir(audioUrl, title, artist, cover || fallback, id);
      card.innerHTML = `
        <img src="${cover || fallback}" alt="" onerror="this.onerror=null;this.src='${fallback}';">
        <div class="card-title">${title}</div>
        <div class="card-sub">${artist}</div>
      `;
      return card;
    }

    function reproducir(audioUrl, title, artist, cover, id, guardar = true) {
      if (!audioUrl) return;
      document.getElementById('nowTitle').innerText = title;
      document.getElementById('nowArtist').innerText = artist;
      
      const coverImg = document.getElementById('playerCover');
      const fallback = generarCoverSVG(title, artist);
      coverImg.src = cover || fallback;
      coverImg.onerror = () => { coverImg.src = fallback; };

      const player = document.getElementById('audioPlayer');
      player.src = audioUrl;
      player.play().catch(() => {});

      if (guardar) guardarEnBiblioteca({ id, title, artist, cover: cover || fallback, audio: audioUrl });
    }

    function cargarBiblioteca() {
      const grid = document.getElementById('library-grid');
      grid.innerHTML = '';
      const favs = JSON.parse(localStorage.getItem('carlosv8_library') || '[]');

      if (favs.length === 0) {
        grid.innerHTML = '<p class="status-msg">Tu biblioteca está vacía. Reproduce cualquier canción para que aparezca aquí automáticamente.</p>';
        return;
      }

      favs.forEach(item => {
        grid.appendChild(crearTarjeta(item.title, item.artist, item.cover, item.audio, item.id));
      });
    }

    function guardarEnBiblioteca(track) {
      let favs = JSON.parse(localStorage.getItem('carlosv8_library') || '[]');
      if (!favs.some(i => i.id === track.id)) {
        favs.unshift(track);
        localStorage.setItem('carlosv8_library', JSON.stringify(favs.slice(0, 30)));
      }
    }
  </script>
</body>
</html>
