<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>CarlosV8 - Music Player (Canciones Completas)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #ffffff; min-height: 100vh; padding-bottom: 110px; display: flex; flex-direction: column; }

    /* Layout Principal */
    .app-container { display: flex; flex: 1; min-height: calc(100vh - 100px); }

    /* Menú Lateral */
    .sidebar {
      width: 240px;
      background-color: #000000;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding: 0 8px; cursor: pointer; }
    .logo-v8 {
      width: 38px; height: 38px; background: #1DB954; color: #000;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 16px;
    }
    .brand-title { color: #ffffff; font-size: 20px; font-weight: 800; }

    .nav-btn {
      background: transparent; border: none; color: #b3b3b3;
      padding: 12px 16px; border-radius: 8px; font-weight: 700; font-size: 14px;
      text-align: left; cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; gap: 14px; width: 100%;
    }
    .nav-btn:hover { color: #ffffff; background-color: #1f1f1f; }
    .nav-btn.active { color: #ffffff; background-color: #282828; }

    /* Panel Principal */
    .main-content { flex: 1; padding: 24px 32px; background: linear-gradient(180deg, #1e1e1e 0%, #121212 300px); overflow-y: auto; }

    /* Buscador Bar */
    .search-bar { display: flex; gap: 12px; max-width: 500px; margin-bottom: 28px; }
    .search-input {
      flex: 1; padding: 12px 20px; border-radius: 50px; border: 1px solid #333;
      background: #242424; color: #fff; font-size: 14px; outline: none;
    }
    .search-input:focus { border-color: #1DB954; }
    .search-btn {
      background: #1DB954; color: #000; border: none; padding: 12px 24px;
      border-radius: 50px; font-weight: bold; cursor: pointer; transition: transform 0.1s, background 0.2s;
    }
    .search-btn:hover { background: #1ed760; transform: scale(1.03); }

    /* Secciones y Rejillas */
    .section-title { font-size: 22px; font-weight: 800; margin: 24px 0 16px 0; color: #ffffff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }

    /* Tarjetas de Música */
    .card {
      background: #181818; padding: 16px; border-radius: 8px; cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    .card:hover { background: #282828; transform: translateY(-4px); }
    .card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; margin-bottom: 12px; background: #282828; display: block; }
    .card-artist-img { border-radius: 50% !important; }
    .card-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .card-sub { font-size: 12px; color: #a7a7a7; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Reproductor Fijo con Reproductor Completo de YouTube */
    .player-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 100px;
      background-color: #000000; border-top: 1px solid #282828;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; z-index: 999;
    }
    .track-info { display: flex; align-items: center; gap: 14px; width: 30%; min-width: 200px; }
    .track-info img { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; background: #282828; }
    .track-details h4 { font-size: 14px; font-weight: 600; color: #fff; }
    .track-details p { font-size: 12px; color: #a7a7a7; margin-top: 2px; }

    .yt-player-container {
      width: 50%; max-width: 500px; height: 80px; border-radius: 8px; overflow: hidden; background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    iframe#ytPlayer { width: 100%; height: 100%; border: none; }

    .status-msg { color: #a7a7a7; font-size: 14px; padding: 20px 0; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Menú Lateral -->
    <aside class="sidebar">
      <div class="brand" onclick="irA('inicio')">
        <div class="logo-v8">V8</div>
        <div class="brand-title">CarlosV8</div>
      </div>
      <button class="nav-btn active" id="btn-inicio" onclick="irA('inicio')">🏠 Inicio</button>
      <button class="nav-btn" id="btn-buscar" onclick="irA('buscar')">🔍 Buscar</button>
      <button class="nav-btn" id="btn-biblioteca" onclick="irA('biblioteca')">📚 Tu biblioteca</button>
    </aside>

    <!-- Panel Principal -->
    <main class="main-content">
      
      <!-- Seccion 1: INICIO -->
      <section id="sec-inicio">
        <h2 class="section-title">🔥 Canciones más Top (Completas)</h2>
        <div class="grid" id="top-songs-grid"></div>

        <h2 class="section-title">⭐ Artistas más Top</h2>
        <div class="grid" id="top-artists-grid"></div>
      </section>

      <!-- Seccion 2: BUSCAR -->
      <section id="sec-buscar" style="display: none;">
        <div class="search-bar">
          <input type="text" id="searchInput" class="search-input" placeholder="¿Qué canción completa buscas?" onkeypress="if(event.key==='Enter') ejecutarBusqueda()">
          <button class="search-btn" onclick="ejecutarBusqueda()">Buscar</button>
        </div>
        <h2 class="section-title" id="search-title">Buscar música</h2>
        <div class="grid" id="search-grid">
          <p class="status-msg">Escribe el nombre de cualquier canción para escucharla entera.</p>
        </div>
      </section>

      <!-- Seccion 3: BIBLIOTECA -->
      <section id="sec-biblioteca" style="display: none;">
        <h2 class="section-title">📚 Tu biblioteca</h2>
        <div class="grid" id="library-grid"></div>
      </section>

    </main>
  </div>

  <!-- Barra del Reproductor con YouTube Embed para Canciones Enteras -->
  <footer class="player-bar">
    <div class="track-info">
      <img id="playerCover" alt="">
      <div class="track-details">
        <h4 id="nowTitle">Selecciona una canción</h4>
        <p id="nowArtist">CarlosV8 Player</p>
      </div>
    </div>
    
    <div class="yt-player-container">
      <iframe id="ytPlayer" src="" allow="autoplay; encrypted-media"></iframe>
    </div>
  </footer>

  <script>
    // Generador de portadas de respaldo en SVG
    function generarCoverSVG(titulo, artista, esArtista = false) {
      const paletas = [
        ['#1DB954', '#121212'], ['#833ab4', '#fd1d1d'], ['#00c6ff', '#0072ff'],
        ['#f857a6', '#ff5858'], ['#7F00FF', '#E100FF'], ['#FF416C', '#FF4B2B']
      ];
      let hash = 0;
      const str = (titulo || '') + (artista || '');
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      const color = paletas[Math.abs(hash) % paletas.length];

      const iniciales = (titulo || 'V8').trim().split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
      const icono = esArtista ? '🎤' : '🎵';

      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${color[0]}"/>
            <stop offset="100%" stop-color="${color[1]}"/>
          </linearGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#g)"/>
        <circle cx="150" cy="130" r="55" fill="rgba(0,0,0,0.25)"/>
        <text x="150" y="145" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">${iniciales}</text>
        <text x="150" y="225" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">${icono}</text>
      </svg>`;

      return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
    }

    function cargarImagenSegura(imgElement, srcUrl, fallbackSvg) {
      if (!srcUrl) {
        imgElement.src = fallbackSvg;
        return;
      }
      imgElement.onerror = function() {
        this.onerror = null;
        this.src = fallbackSvg;
      };
      imgElement.src = srcUrl;
    }

    // Lista de Canciones Top con IDs de YouTube para reproducir COMPLETAS
    const topCanciones = [
      { id: 'c1', title: 'Columbia', artist: 'Quevedo', ytId: 'm49a2gA2LNo', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/9c/6b/a8/9c6ba8db-4e92-3d23-7a91-4d048fa5d24b/8445162402179.jpg/300x300bb.jpg' },
      { id: 'c2', title: 'LALA', artist: 'Myke Towers', ytId: 'g202Bv-N4qA', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/44/21/87/442187f8-7b8c-1e82-2a78-2bf0f9d94f27/197188350711.jpg/300x300bb.jpg' },
      { id: 'c3', title: 'Classy 101', artist: 'Feid & Young Miko', ytId: 'sJ92c_Z6x3s', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/80/4f/9b/804f9b8c-5722-1d5f-1e87-f8e1bc98918a/23UMGIM33400.rgb.jpg/300x300bb.jpg' },
      { id: 'c4', title: 'El Merengue', artist: 'Marshmello & Manuel Turizo', ytId: 'z-vX2aUoX0g', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/10/9f/6a/109f6a1e-a4be-b472-a72a-e8d970e30349/196871038312.jpg/300x300bb.jpg' },
      { id: 'c5', title: 'BABY HELLO', artist: 'Rauw Alejandro & Bizarrap', ytId: 'S_n41vN8A24', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/b8/12/57/b812574e-5c40-3023-95cf-cb937e4d8050/196871230181.jpg/300x300bb.jpg' },
      { id: 'c6', title: 'Los del Espacio', artist: 'LIT killah, Duki, Emilia', ytId: 'T8X9dM4n-Q0', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/19/21/ed/1921edbf-803d-82d2-28e9-df75fb8fb5c6/5054197682283.jpg/300x300bb.jpg' },
      { id: 'c7', title: 'Polaris Remix', artist: 'Saiko, Quevedo, Feid', ytId: 'm4Xo4J2w8mQ', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/80/7e/40/807e408d-73a7-548d-6925-502011bfa30f/8445162810059.jpg/300x300bb.jpg' },
      { id: 'c8', title: 'CORAZÓN VACÍO', artist: 'Maria Becerra', ytId: 'u4kI1C4l0E4', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/2b/23/ef/2b23ef24-69c7-5058-29be-4e78f69f2e30/5054197693992.jpg/300x300bb.jpg' },
      { id: 'c9', title: 'MONACO', artist: 'Bad Bunny', ytId: 'f0X90C8eA4M', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/21/f0/3a/21f03a6c-59df-961d-7206-8d6ef7174db1/197188898145.jpg/300x300bb.jpg' },
      { id: 'c10', title: 'LUNA', artist: 'Feid & ATL Jacob', ytId: 'sL2B734a2e0', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/91/9e/c3/919ec31a-f739-9686-22a8-a3f2db724e8e/23UMGIM95156.rgb.jpg/300x300bb.jpg' },
      { id: 'c11', title: 'Reina', artist: 'Mora & Saiko', ytId: '8qL7d9Z9b-A', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/e5/22/02/e52202bc-b80c-0331-508b-ee5fa65cb65a/197188737383.jpg/300x300bb.jpg' },
      { id: 'c12', title: 'Madrid City', artist: 'Ana Mena', ytId: 'P7D4lB5M2sY', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/e2/ee/2e/e2ee2e2d-3047-9f6b-0b16-560416fb98d8/196871460595.jpg/300x300bb.jpg' }
    ];

    // Lista de Artistas Top
    const topArtistas = [
      { name: 'Quevedo', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/9c/6b/a8/9c6ba8db-4e92-3d23-7a91-4d048fa5d24b/8445162402179.jpg/300x300bb.jpg' },
      { name: 'Feid', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/80/4f/9b/804f9b8c-5722-1d5f-1e87-f8e1bc98918a/23UMGIM33400.rgb.jpg/300x300bb.jpg' },
      { name: 'Bad Bunny', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/21/f0/3a/21f03a6c-59df-961d-7206-8d6ef7174db1/197188898145.jpg/300x300bb.jpg' },
      { name: 'Myke Towers', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/44/21/87/442187f8-7b8c-1e82-2a78-2bf0f9d94f27/197188350711.jpg/300x300bb.jpg' },
      { name: 'Rauw Alejandro', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/b8/12/57/b812574e-5c40-3023-95cf-cb937e4d8050/196871230181.jpg/300x300bb.jpg' },
      { name: 'Saiko', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/80/7e/40/807e408d-73a7-548d-6925-502011bfa30f/8445162810059.jpg/300x300bb.jpg' },
      { name: 'Bizarrap', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/b8/12/57/b812574e-5c40-3023-95cf-cb937e4d8050/196871230181.jpg/300x300bb.jpg' },
      { name: 'Maria Becerra', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/2b/23/ef/2b23ef24-69c7-5058-29be-4e78f69f2e30/5054197693992.jpg/300x300bb.jpg' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const playerCover = document.getElementById('playerCover');
      cargarImagenSegura(playerCover, '', generarCoverSVG('CarlosV8', 'Player'));
      cargarInicio();
    });

    function irA(seccion) {
      document.querySelectorAll('.sidebar .nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${seccion}`).classList.add('active');

      document.getElementById('sec-inicio').style.display = (seccion === 'inicio') ? 'block' : 'none';
      document.getElementById('sec-buscar').style.display = (seccion === 'buscar') ? 'block' : 'none';
      document.getElementById('sec-biblioteca').style.display = (seccion === 'biblioteca') ? 'block' : 'none';

      if (seccion === 'inicio') cargarInicio();
      if (seccion === 'buscar') document.getElementById('searchInput').focus();
      if (seccion === 'biblioteca') cargarBiblioteca();
    }

    function cargarInicio() {
      const songGrid = document.getElementById('top-songs-grid');
      songGrid.innerHTML = '';
      topCanciones.forEach(item => {
        songGrid.appendChild(crearTarjeta(item.title, item.artist, item.cover, item.ytId, item.id, false));
      });

      const artistGrid = document.getElementById('top-artists-grid');
      artistGrid.innerHTML = '';
      topArtistas.forEach(artist => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => {
          irA('buscar');
          document.getElementById('searchInput').value = artist.name;
          ejecutarBusqueda();
        };

        const img = document.createElement('img');
        img.className = 'card-artist-img';
        cargarImagenSegura(img, artist.cover, generarCoverSVG(artist.name, 'Artista', true));

        const titleDiv = document.createElement('div');
        titleDiv.className = 'card-title';
        titleDiv.style.textAlign = 'center';
        titleDiv.innerText = artist.name;

        const subDiv = document.createElement('div');
        subDiv.className = 'card-sub';
        subDiv.style.textAlign = 'center';
        subDiv.innerText = 'Artista';

        card.appendChild(img);
        card.appendChild(titleDiv);
        card.appendChild(subDiv);
        artistGrid.appendChild(card);
      });
    }

    async function ejecutarBusqueda() {
      irA('buscar');
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const titleEl = document.getElementById('search-title');
      const gridEl = document.getElementById('search-grid');
      titleEl.innerText = `Resultados para "${query}"`;
      gridEl.innerHTML = '<p class="status-msg">Buscando canciones completas...</p>';

      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=18`);
        const data = await res.json();

        gridEl.innerHTML = '';
        if (!data.results || data.results.length === 0) {
          gridEl.innerHTML = '<p class="status-msg">No se encontraron resultados para esta búsqueda.</p>';
          return;
        }

        data.results.forEach(track => {
          const coverUrl = track.artworkUrl100 ? track.artworkUrl100.replace('100x100bb', '300x300bb') : '';
          // Búsqueda dinámica directa de YouTube
          const searchQuery = encodeURIComponent(`${track.trackName} ${track.artistName}`);
          gridEl.appendChild(crearTarjeta(track.trackName, track.artistName, coverUrl, searchQuery, track.trackId, false, true));
        });

      } catch (err) {
        gridEl.innerHTML = '<p class="status-msg" style="color: #ff5555;">Error al realizar la búsqueda. Inténtalo de nuevo.</p>';
      }
    }

    function crearTarjeta(title, artist, coverUrl, ytSource, id, esArtista = false, esBusquedaDirecta = false) {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => reproducirCompleta(ytSource, title, artist, coverUrl, id, true, esBusquedaDirecta);

      const img = document.createElement('img');
      if (esArtista) img.className = 'card-artist-img';
      cargarImagenSegura(img, coverUrl, generarCoverSVG(title, artist, esArtista));

      const titleDiv = document.createElement('div');
      titleDiv.className = 'card-title';
      titleDiv.innerText = title;

      const subDiv = document.createElement('div');
      subDiv.className = 'card-sub';
      subDiv.innerText = artist;

      card.appendChild(img);
      card.appendChild(titleDiv);
      card.appendChild(subDiv);

      return card;
    }

    function reproducirCompleta(ytSource, title, artist, coverUrl, id, guardar = true, esBusquedaDirecta = false) {
      document.getElementById('nowTitle').innerText = title;
      document.getElementById('nowArtist').innerText = artist;
      
      const coverImg = document.getElementById('playerCover');
      cargarImagenSegura(coverImg, coverUrl, generarCoverSVG(title, artist, false));

      const ytPlayer = document.getElementById('ytPlayer');
      
      // Reproducir versión completa a través del reproductor incrustado de YouTube
      if (esBusquedaDirecta) {
        ytPlayer.src = `https://www.youtube.com/embed?listType=search&list=${ytSource}&autoplay=1`;
      } else {
        ytPlayer.src = `https://www.youtube.com/embed/${ytSource}?autoplay=1`;
      }

      if (guardar && id) guardarEnBiblioteca({ id, title, artist, cover: coverUrl, ytSource, esBusquedaDirecta });
    }

    function cargarBiblioteca() {
      const grid = document.getElementById('library-grid');
      grid.innerHTML = '';
      const favs = JSON.parse(localStorage.getItem('carlosv8_library') || '[]');

      if (favs.length === 0) {
        grid.innerHTML = '<p class="status-msg">Tu biblioteca está vacía. Selecciona cualquier canción para guardarla aquí.</p>';
        return;
      }

      favs.forEach(item => {
        grid.appendChild(crearTarjeta(item.title, item.artist, item.cover, item.ytSource, item.id, false, item.esBusquedaDirecta));
      });
    }

    function guardarEnBiblioteca(track) {
      let favs = JSON.parse(localStorage.getItem('carlosv8_library') || '[]');
      if (!favs.some(i => i.id === track.id)) {
        favs.unshift(track);
        localStorage.setItem('carlosv8_library', JSON.stringify(favs.slice(0, 30)));
      }
    }
  </script>
</body>
</html>
