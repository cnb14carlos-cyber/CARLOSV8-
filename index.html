<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>CarlosV8 - Music Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #ffffff; min-height: 100vh; padding-bottom: 90px; }

    .app-container { display: flex; min-height: calc(100vh - 90px); }

    /* Menú lateral */
    .sidebar {
      width: 220px; background: #000000; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; flex-shrink: 0;
    }
    .brand { font-size: 20px; font-weight: 800; color: #1DB954; }
    .nav-btn {
      background: #282828; border: none; color: #ffffff; padding: 10px 14px;
      border-radius: 6px; font-weight: 600; text-align: left; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px;
    }

    /* Contenido Principal */
    .main-content { flex: 1; padding: 30px; background: #121212; }
    
    .search-container {
      background: #181818; padding: 20px; border-radius: 12px; margin-bottom: 24px; border: 1px solid #282828;
    }
    .search-box { display: flex; gap: 10px; margin-top: 10px; }
    .search-box input {
      flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #333; background: #222; color: #fff; font-size: 15px; outline: none;
    }
    .search-box button {
      background: #1DB954; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; color: #000; cursor: pointer; transition: 0.2s;
    }
    .search-box button:hover { background: #1ed760; }

    .section-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; color: #1DB954; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
    .card { background: #181818; padding: 14px; border-radius: 10px; cursor: pointer; transition: background 0.2s, transform 0.2s; }
    .card:hover { background: #252525; transform: translateY(-3px); }
    .card img { width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; background: #282828; display: block; }
    .card-title { font-weight: bold; margin-top: 10px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .card-sub { color: #aaaaaa; font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Reproductor Inferior */
    .player-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 90px;
      background: #000000; border-top: 1px solid #1f1f1f; display: flex;
      align-items: center; justify-content: space-between; padding: 0 24px; z-index: 100;
    }
    .track-info { display: flex; align-items: center; gap: 14px; }
    .cover-badge {
      width: 48px; height: 48px; background: #1DB954; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; color: #000; flex-shrink: 0; overflow: hidden;
    }
    .cover-badge img { width: 100%; height: 100%; object-fit: cover; }
    .track-text { display: flex; flex-direction: column; }
    .track-title { font-weight: bold; font-size: 14px; color: #ffffff; }
    .track-artist { color: #aaaaaa; font-size: 12px; margin-top: 2px; }

    .player-controls { display: flex; align-items: center; gap: 15px; }
    audio { outline: none; height: 40px; width: 320px; }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="brand">CarlosV8</div>
      <button class="nav-btn">🏠 Inicio</button>
    </aside>

    <main class="main-content">
      <div class="search-container">
        <h2>Buscador Directo (Sin Anuncios)</h2>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Escribe canción o artista..." onkeypress="if(event.key==='Enter') buscarVideo()">
          <button onclick="buscarVideo()">Buscar</button>
        </div>
      </div>

      <h2 class="section-title" id="tituloResultados">Resultados</h2>
      <div class="grid" id="gridResultados"></div>
    </main>
  </div>

  <footer class="player-bar">
    <div class="track-info">
      <div class="cover-badge" id="coverContainer">V8</div>
      <div class="track-text">
        <div class="track-title" id="title">Selecciona una canción</div>
        <div class="track-artist" id="artist">CarlosV8 Player</div>
      </div>
    </div>
    <div class="player-controls">
      <audio id="audioPlayer" controls autoplay></audio>
    </div>
  </footer>

  <script>
    // Lista de servidores para probar automáticamente si uno falla
    const API_SERVERS = [
      'https://api.piped.privacydev.net',
      'https://pipedapi.adminforge.de',
      'https://pipedapi.drgns.space',
      'https://pipedapi.kavin.rocks'
    ];

    async function fetchConRespaldo(endpoint) {
      for (const server of API_SERVERS) {
        try {
          const res = await fetch(`${server}${endpoint}`);
          if (res.ok) return await res.json();
        } catch (e) {
          console.warn(`Falló ${server}, probando siguiente servidor...`);
        }
      }
      throw new Error('Servidores no disponibles');
    }

    async function buscarVideo() {
      const q = document.getElementById('searchInput').value.trim() || 'Bad Bunny MONACO';
      const grid = document.getElementById('gridResultados');
      document.getElementById('tituloResultados').innerText = `Resultados para "${q}"`;
      grid.innerHTML = '<p style="color:#aaa;">Buscando canción...</p>';

      try {
        const data = await fetchConRespaldo(`/search?q=${encodeURIComponent(q)}&filter=videos`);
        grid.innerHTML = '';

        if (!data.items || data.items.length === 0) {
          grid.innerHTML = '<p style="color:#aaa;">No se encontraron resultados.</p>';
          return;
        }

        data.items.slice(0, 20).forEach(v => {
          const videoId = v.url.replace('/watch?v=', '');
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => reproducirSinAnuncios(videoId, v.title, v.uploaderName, v.thumbnail);

          card.innerHTML = `
            <img src="${v.thumbnail}" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/150/282828/ffffff?text=V8'">
            <div class="card-title">${v.title}</div>
            <div class="card-sub">${v.uploaderName}</div>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        grid.innerHTML = '<p style="color:#ff5555;">Error de red. Intenta pulsar Buscar de nuevo.</p>';
      }
    }

    async function reproducirSinAnuncios(ytId, title, artist, cover) {
      document.getElementById('title').innerText = title;
      document.getElementById('artist').innerText = artist;
      document.getElementById('coverContainer').innerHTML = `<img src="${cover}" referrerpolicy="no-referrer">`;

      const player = document.getElementById('audioPlayer');
      player.pause();

      try {
        const data = await fetchConRespaldo(`/streams/${ytId}`);
        const audioStream = data.audioStreams ? data.audioStreams[0] : null;

        if (audioStream && audioStream.url) {
          player.src = audioStream.url;
          player.play();
        } else {
          alert('No se pudo obtener el audio de esta canción.');
        }
      } catch (e) {
        console.error('Error al reproducir audio:', e);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('searchInput').value = 'Bad Bunny MONACO';
      buscarVideo();
    });
  </script>
</body>
</html>
