<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Evita que GitHub Pages sea bloqueado por servidores de imágenes de YouTube/Apple -->
  <meta name="referrer" content="no-referrer">
  <title>CarlosV8 - Music Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #ffffff; padding-bottom: 120px; min-height: 100vh; }

    .app-container { display: flex; min-height: calc(100vh - 100px); }

    /* Menú lateral */
    .sidebar {
      width: 220px; background: #000; padding: 20px 16px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;
    }
    .brand { font-size: 20px; font-weight: 800; color: #1DB954; margin-bottom: 15px; }
    .nav-btn {
      background: transparent; border: none; color: #b3b3b3; padding: 10px 14px;
      border-radius: 8px; font-weight: bold; text-align: left; cursor: pointer; transition: 0.2s;
    }
    .nav-btn:hover, .nav-btn.active { color: #fff; background: #282828; }

    /* Panel principal */
    .main-content { flex: 1; padding: 24px; background: #121212; }
    .section-title { font-size: 20px; font-weight: 800; margin-bottom: 16px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
    .card { background: #181818; padding: 14px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .card:hover { background: #282828; transform: translateY(-3px); }
    .card img { width: 100%; aspect-ratio: 1; border-radius: 6px; object-fit: cover; background: #282828; display: block; }
    .card-title { font-weight: bold; margin-top: 10px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { color: #aaa; font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Reproductor inferior */
    .player-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 95px;
      background: #000; border-top: 1px solid #282828; display: flex;
      align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100;
    }
    .track-info { display: flex; align-items: center; gap: 12px; width: 35%; }
    .track-info img { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; background: #282828; }

    .yt-container { width: 300px; height: 75px; border-radius: 8px; overflow: hidden; background: #000; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="brand">CarlosV8</div>
      <button class="nav-btn active">🏠 Inicio</button>
    </aside>

    <main class="main-content">
      <h2 class="section-title">🔥 Canciones Completas (YouTube Directo)</h2>
      <div class="grid" id="songsGrid"></div>
    </main>
  </div>

  <footer class="player-bar">
    <div class="track-info">
      <img id="cover" src="" alt="">
      <div>
        <div id="title" style="font-weight:bold; font-size:14px;">Selecciona una canción</div>
        <div id="artist" style="color:#aaa; font-size:12px;">CarlosV8 Player</div>
      </div>
    </div>
    <div class="yt-container">
      <iframe id="ytFrame" allow="autoplay; encrypted-media"></iframe>
    </div>
  </footer>

  <script>
    // Genera una portada con las iniciales si la foto de internet falla
    function generarPortadaSVG(titulo) {
      const iniciales = (titulo || 'V8').substring(0, 2).toUpperCase();
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
        <rect width="100%" height="100%" fill="#1DB954"/>
        <text x="50%" y="55%" font-family="sans-serif" font-size="60" font-weight="bold" fill="#000" text-anchor="middle" dominant-baseline="middle">${iniciales}</text>
      </svg>`;
      return 'data:image/svg+xml;base64,' + btoa(svg);
    }

    const canciones = [
      { title: 'Columbia', artist: 'Quevedo', ytId: 'm49a2gA2LNo', cover: 'https://i.ytimg.com/vi/m49a2gA2LNo/hqdefault.jpg' },
      { title: 'LALA', artist: 'Myke Towers', ytId: 'g202Bv-N4qA', cover: 'https://i.ytimg.com/vi/g202Bv-N4qA/hqdefault.jpg' },
      { title: 'Classy 101', artist: 'Feid & Young Miko', ytId: 'sJ92c_Z6x3s', cover: 'https://i.ytimg.com/vi/sJ92c_Z6x3s/hqdefault.jpg' },
      { title: 'LUNA', artist: 'Feid', ytId: 'sL2B734a2e0', cover: 'https://i.ytimg.com/vi/sL2B734a2e0/hqdefault.jpg' },
      { title: 'MONACO', artist: 'Bad Bunny', ytId: 'f0X90C8eA4M', cover: 'https://i.ytimg.com/vi/f0X90C8eA4M/hqdefault.jpg' }
    ];

    const grid = document.getElementById('songsGrid');

    canciones.forEach(s => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => reproducir(s.ytId, s.title, s.artist, s.cover);

      const fallback = generarPortadaSVG(s.title);
      card.innerHTML = `
        <img src="${s.cover}" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='${fallback}';">
        <div class="card-title">${s.title}</div>
        <div class="card-sub">${s.artist}</div>
      `;
      grid.appendChild(card);
    });

    function reproducir(ytId, title, artist, cover) {
      document.getElementById('title').innerText = title;
      document.getElementById('artist').innerText = artist;

      const coverImg = document.getElementById('cover');
      coverImg.referrerPolicy = "no-referrer";
      coverImg.onerror = function() {
        this.onerror = null;
        this.src = generarPortadaSVG(title);
      };
      coverImg.src = cover;

      document.getElementById('ytFrame').src = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1`;
    }

    // Carga la portada inicial del reproductor
    document.getElementById('cover').src = generarPortadaSVG('V8');
  </script>
</body>
</html>
