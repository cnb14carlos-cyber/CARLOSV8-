<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarlosV8 - Audius API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0d0d0d; color: #fff; min-height: 100vh; padding-bottom: 110px; }

    .app-container { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; max-width: 1300px; margin: 0 auto; }

    .sidebar { width: 240px; background: #181818; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; height: fit-content; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-v8 { width: 40px; height: 40px; background: #1DB954; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; }
    .brand h2 { color: #1DB954; font-size: 20px; }

    .main-content { flex: 1; min-width: 300px; background: #181818; border-radius: 12px; padding: 24px; }
    .search-box { display: flex; gap: 10px; max-width: 500px; margin-bottom: 20px; }
    .search-box input { flex: 1; padding: 12px 18px; border-radius: 50px; border: 1px solid #333; background: #242424; color: #fff; outline: none; }
    .search-box button { background: #1DB954; border: none; padding: 12px 20px; border-radius: 50px; font-weight: bold; cursor: pointer; }

    .grid-songs { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .card { background: #222; padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .card:hover { background: #2c2c2c; }
    .card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; margin-bottom: 8px; background: #333; }
    .card-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-artist { font-size: 11px; color: #aaa; margin-top: 2px; }

    .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 90px; background: #121212; border-top: 1px solid #282828; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; }
    .track-info { display: flex; align-items: center; gap: 12px; width: 30%; }
    .track-info img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: #222; }
    audio { width: 50%; height: 40px; filter: invert(100%) hue-rotate(90deg); }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="sidebar">
      <div class="brand">
        <div class="logo-v8">V8</div>
        <h2>CarlosV8</h2>
      </div>
      <p style="font-size: 12px; color: #888;">API Oficial: Audius Music Stream</p>
    </div>

    <div class="main-content">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar música (ej: EDM, Rock, Lo-Fi)..." onkeypress="if(event.key==='Enter') buscarMusica()">
        <button onclick="buscarMusica()">Buscar</button>
      </div>
      <h3 style="margin-bottom: 15px;" id="statusText">Canciones Populares</h3>
      <div class="grid-songs" id="songsGrid"></div>
    </div>
  </div>

  <div class="player-bar">
    <div class="track-info">
      <img id="playerCover" src="https://via.placeholder.com/150/181818/1DB954?text=V8" alt="Cover">
      <div>
        <h4 id="nowTitle" style="font-size: 14px;">Selecciona una canción</h4>
        <p id="nowArtist" style="font-size: 12px; color: #aaa;">CarlosV8 Player</p>
      </div>
    </div>
    <audio id="audioPlayer" controls autoplay></audio>
  </div>

  <script>
    const APP_NAME = 'CarlosV8Player';
    const API_BASE = 'https://discoveryprovider.audius.co/v1';

    window.onload = () => {
      cargarTendencias();
    };

    async function cargarTendencias() {
      document.getElementById('statusText').innerText = 'Tendencias del momento';
      try {
        const res = await fetch(`${API_BASE}/tracks/trending?app_name=${APP_NAME}`);
        const json = await res.json();
        mostrarCanciones(json.data);
      } catch (e) {
        document.getElementById('statusText').innerText = 'Error al conectar con la API';
      }
    }

    async function buscarMusica() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      document.getElementById('statusText').innerText = `Resultados para "${query}"`;
      try {
        const res = await fetch(`${API_BASE}/tracks/search?query=${encodeURIComponent(query)}&app_name=${APP_NAME}`);
        const json = await res.json();
        mostrarCanciones(json.data);
      } catch (e) {
        document.getElementById('statusText').innerText = 'Error en la búsqueda';
      }
    }

    function mostrarCanciones(lista) {
      const grid = document.getElementById('songsGrid');
      grid.innerHTML = '';

      if (!lista || lista.length === 0) {
        grid.innerHTML = '<p style="color:#aaa;">No se encontraron resultados.</p>';
        return;
      }

      lista.forEach(track => {
        const cover = track.artwork ? track.artwork['150x150'] : 'https://via.placeholder.com/150/222/ffffff?text=Music';
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => reproducir(track.id, track.title, track.user.name, cover);

        card.innerHTML = `
          <img src="${cover}" alt="Artwork">
          <div class="card-title">${track.title}</div>
          <div class="card-author">${track.user.name}</div>
        `;
        grid.appendChild(card);
      });
    }

    function reproducir(trackId, title, artist, cover) {
      document.getElementById('nowTitle').innerText = title;
      document.getElementById('nowArtist').innerText = artist;
      document.getElementById('playerCover').src = cover;

      const streamUrl = `${API_BASE}/tracks/${trackId}/stream?app_name=${APP_NAME}`;
      const player = document.getElementById('audioPlayer');
      player.src = streamUrl;
      player.play();
    }
  </script>
</body>
</html>
