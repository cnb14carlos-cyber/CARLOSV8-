<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarlosV8 - Reproductor Completo</title>
  <style>
    :root {
      --accent: #8a2be2;
      --bg-dark: #0f0f13;
      --bg-card: #181820;
      --bg-sidebar: #0a0a0d;
      --bg-player: #121218;
      --text-main: #ffffff;
      --text-sub: #a0a0b0;
      --border: #262633;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 110px; }

    .app { display: flex; min-height: calc(100vh - 110px); }

    /* Menú Lateral */
    .sidebar { width: 230px; background: var(--bg-sidebar); padding: 20px 16px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    .brand { font-size: 22px; font-weight: 800; color: var(--accent); margin-bottom: 16px; }
    .nav-item { background: transparent; border: none; color: var(--text-sub); padding: 12px 14px; border-radius: 8px; font-weight: 600; text-align: left; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 10px; }
    .nav-item:hover, .nav-item.active { color: #fff; background: var(--bg-card); }
    .nav-item.active { border-left: 3px solid var(--accent); }

    /* Contenido Principal */
    .content { flex: 1; padding: 24px; overflow-y: auto; }

    .top-bar { display: flex; gap: 12px; margin-bottom: 24px; }
    .search-input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid var(--border); background: var(--bg-card); color: #fff; font-size: 14px; outline: none; }
    .btn-main { background: var(--accent); border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; color: #fff; cursor: pointer; }

    .section-title { font-size: 20px; font-weight: 800; margin: 20px 0 14px 0; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .card { background: var(--bg-card); padding: 12px; border-radius: 10px; cursor: pointer; transition: 0.15s; border: 1px solid transparent; }
    .card:hover { border-color: var(--border); transform: translateY(-3px); }
    .card img { width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; background: #222; }
    .card-title { font-weight: bold; margin-top: 10px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { color: var(--text-sub); font-size: 11px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Reproductor en Parte Inferior */
    .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 110px; background: var(--bg-player); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; z-index: 100; gap: 20px; }
    .track-info { display: flex; align-items: center; gap: 12px; width: 250px; }
    .cover-box { width: 50px; height: 50px; background: #222; border-radius: 6px; overflow: hidden; flex-shrink: 0; }
    .cover-box img { width: 100%; height: 100%; object-fit: cover; }
    .track-title { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { color: var(--text-sub); font-size: 12px; margin-top: 2px; }

    /* Pantalla de Reproductor de YouTube */
    .youtube-container { flex: 1; max-width: 500px; height: 80px; border-radius: 8px; overflow: hidden; background: #000; }
    .youtube-container iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">🎵 CarlosV8</div>
      <button class="nav-item active" onclick="verSeccion('top')">🔥 Canciones Completas</button>
      <button class="nav-item" onclick="verSeccion('locales')">💾 Subir Mis MP3</button>
    </aside>

    <main class="content">
      <div class="top-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar canción completa (ej: LALION, Bad Bunny...)" onkeypress="if(event.key==='Enter') buscarYT()">
        <button class="btn-main" onclick="buscarYT()">Buscar</button>
      </div>

      <div id="viewContainer"></div>
    </main>
  </div>

  <!-- Reproductor Inferior con YouTube -->
  <footer class="player-bar">
    <div class="track-info">
      <div class="cover-box" id="pCover"><div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--accent);">🎵</div></div>
      <div style="overflow:hidden;">
        <div class="track-title" id="pTitle">Selecciona una canción</div>
        <div class="track-artist" id="pArtist">Canción Entera (YouTube)</div>
      </div>
    </div>

    <!-- Integración de reproductor YouTube para canciones completas -->
    <div class="youtube-container" id="ytPlayerBox">
      <div style="color:#aaa; font-size:12px; display:flex; align-items:center; justify-content:center; height:100%;">
        Haz clic en una canción para reproducirla entera
      </div>
    </div>
  </footer>

  <script>
    // Canciones de ejemplo con IDs de YouTube para reproducir completas
    const cancionesCompletas = [
      { title: 'MONACO', artist: 'Bad Bunny', ytId: 'V9PVRfjEBTI', cover: 'https://img.youtube.com/vi/V9PVRfjEBTI/hqdefault.jpg' },
      { title: 'Columbia', artist: 'Quevedo', ytId: 'QeI2XmKTh0M', cover: 'https://img.youtube.com/vi/QeI2XmKTh0M/hqdefault.jpg' },
      { title: 'LALA', artist: 'Myke Towers', ytId: 'gA_33S3e_Xg', cover: 'https://img.youtube.com/vi/gA_33S3e_Xg/hqdefault.jpg' },
      { title: 'LUNA', artist: 'Feid & ATL Jacob', ytId: '6T3oR1JzvhU', cover: 'https://img.youtube.com/vi/6T3oR1JzvhU/hqdefault.jpg' }
    ];

    function verSeccion(sec) {
      const container = document.getElementById('viewContainer');
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

      if (sec === 'top') {
        container.innerHTML = `<h2 class="section-title">🔥 Éxitos Destacados (Canciones Enteras)</h2><div class="grid" id="mainGrid"></div>`;
        renderGrid(cancionesCompletas, 'mainGrid');
      } else if (sec === 'locales') {
        container.innerHTML = `
          <h2 class="section-title">💾 Tus Archivos MP3 Completos</h2>
          <div style="background:var(--bg-card); padding:30px; border-radius:12px; text-align:center; border:2px dashed var(--border);">
            <p style="margin-bottom:15px; color:var(--text-sub);">Si tienes canciones descargadas en tu dispositivo, puedes subirlas para escucharlas enteras:</p>
            <input type="file" id="mp3Input" accept="audio/*" multiple style="display:none;" onchange="cargarLocales(event)">
            <button class="btn-main" onclick="document.getElementById('mp3Input').click()">📂 Cargar Archivos MP3</button>
          </div>
          <div class="grid" id="localGrid" style="margin-top:20px;"></div>
        `;
      }
    }

    function renderGrid(lista, elementId) {
      const grid = document.getElementById(elementId);
      if (!grid) return;
      grid.innerHTML = '';

      lista.forEach(s => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => reproducirEntera(s);

        card.innerHTML = `
          <img src="${s.cover}">
          <div class="card-title">${s.title}</div>
          <div class="card-sub">${s.artist}</div>
        `;
        grid.appendChild(card);
      });
    }

    function reproducirEntera(s) {
      document.getElementById('pTitle').innerText = s.title;
      document.getElementById('pArtist').innerText = s.artist;
      document.getElementById('pCover').innerHTML = `<img src="${s.cover}">`;

      const box = document.getElementById('ytPlayerBox');

      if (s.ytId) {
        // Carga la canción completa desde YouTube
        box.innerHTML = `<iframe src="https://www.youtube.com/embed/${s.ytId}?autoplay=1" allow="autoplay"></iframe>`;
      } else if (s.localUrl) {
        // Carga el archivo local completo
        box.innerHTML = `<audio controls autoplay style="width:100%; margin-top:20px;"><source src="${s.localUrl}"></audio>`;
      }
    }

    function buscarYT() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;

      // Buscar directamente el vídeo/canción en YouTube
      const queryEnc = encodeURIComponent(q + " audio");
      const ytSearchUrl = `https://www.youtube.com/results?search_query=${queryEnc}`;

      // Abre la búsqueda completa o te permite reproducir cualquier término
      alert(`Buscando la canción completa "${q}". Presiona Aceptar para ver los resultados enteros.`);
      window.open(ytSearchUrl, '_blank');
    }

    function cargarLocales(e) {
      const files = Array.from(e.target.files);
      const lista = files.map(file => ({
        title: file.name.replace(/\.[^/.]+$/, ""),
        artist: 'Archivo Local MP3',
        cover: 'https://via.placeholder.com/200/8a2be2/ffffff?text=MP3',
        localUrl: URL.createObjectURL(file)
      }));

      renderGrid(lista, 'localGrid');
    }

    document.addEventListener('DOMContentLoaded', () => {
      verSeccion('top');
    });
  </script>
</body>
</html>
