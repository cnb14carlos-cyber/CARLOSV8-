<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarlosV8 - Canciones Completas</title>
  <style>
    :root {
      --accent: #8a2be2;
      --bg-dark: #0f0f13;
      --bg-card: #181820;
      --bg-sidebar: #0a0a0d;
      --bg-player: #121218;
      --text-main: #ffffff;
      --text-sub: #a0a0b0;
      --border: #262633;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 140px; }

    .app { display: flex; min-height: calc(100vh - 140px); }

    /* Menú Lateral */
    .sidebar { width: 230px; background: var(--bg-sidebar); padding: 20px 16px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    .brand { font-size: 22px; font-weight: 800; color: var(--accent); margin-bottom: 16px; }
    .nav-item { background: transparent; border: none; color: var(--text-sub); padding: 12px 14px; border-radius: 8px; font-weight: 600; text-align: left; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 10px; }
    .nav-item:hover, .nav-item.active { color: #fff; background: var(--bg-card); }
    .nav-item.active { border-left: 3px solid var(--accent); }

    /* Contenido Principal */
    .content { flex: 1; padding: 24px; overflow-y: auto; }

    .top-bar { display: flex; gap: 12px; margin-bottom: 24px; }
    .search-input { flex: 1; padding: 14px 18px; border-radius: 25px; border: 1px solid var(--border); background: var(--bg-card); color: #fff; font-size: 15px; outline: none; }
    .btn-main { background: var(--accent); border: none; padding: 14px 24px; border-radius: 25px; font-weight: bold; color: #fff; cursor: pointer; }
    .btn-main:hover { opacity: 0.9; }

    .section-title { font-size: 20px; font-weight: 800; margin: 20px 0 14px 0; }

    /* Grilla de Canciones */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .card { background: var(--bg-card); padding: 12px; border-radius: 10px; cursor: pointer; transition: 0.15s; border: 1px solid transparent; }
    .card:hover { border-color: var(--border); transform: translateY(-3px); }
    .card img { width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; background: #222; }
    .card-title { font-weight: bold; margin-top: 10px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { color: var(--text-sub); font-size: 11px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Reproductor Completo en Parte Inferior */
    .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 130px; background: var(--bg-player); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; z-index: 100; gap: 20px; }
    .track-info { display: flex; align-items: center; gap: 12px; width: 220px; flex-shrink: 0; }
    .cover-box { width: 50px; height: 50px; background: #222; border-radius: 6px; overflow: hidden; flex-shrink: 0; }
    .cover-box img { width: 100%; height: 100%; object-fit: cover; }
    .track-title { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { color: var(--text-sub); font-size: 12px; margin-top: 2px; }

    /* Contenedor del Reproductor YouTube Completo */
    .yt-embed-box { flex: 1; max-width: 650px; height: 105px; border-radius: 8px; overflow: hidden; background: #000; border: 1px solid var(--border); }
    .yt-embed-box iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">🎵 CarlosV8</div>
      <button class="nav-item active">🔥 Canciones Completas</button>
    </aside>

    <main class="content">
      <div class="top-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Escribe cualquier canción o artista (ej: LALION, Quevedo, Bad Bunny)..." onkeypress="if(event.key==='Enter') buscarCancionEntera()">
        <button class="btn-main" onclick="buscarCancionEntera()">Reproducir Entera</button>
      </div>

      <h2 class="section-title">🔥 Éxitos Populares (Completos)</h2>
      <div class="grid" id="mainGrid"></div>
    </main>
  </div>

  <!-- Reproductor Inferior de Canción Completa -->
  <footer class="player-bar">
    <div class="track-info">
      <div class="cover-box" id="pCover"><div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--accent);">🎵</div></div>
      <div style="overflow:hidden;">
        <div class="track-title" id="pTitle">Selecciona una canción</div>
        <div class="track-artist" id="pArtist">Audio 100% Completo</div>
      </div>
    </div>

    <div class="yt-embed-box" id="ytContainer">
      <div style="color:#aaa; font-size:13px; display:flex; align-items:center; justify-content:center; height:100%;">
        Haz clic en cualquier canción para escucharla entera de principio a fin
      </div>
    </div>
  </footer>

  <script>
    // Lista con canciones preconfiguradas para reproducir completas
    const cancionesTops = [
      { title: 'MONACO', artist: 'Bad Bunny', query: 'Bad Bunny MONACO audio oficial', cover: 'https://img.youtube.com/vi/V9PVRfjEBTI/hqdefault.jpg' },
      { title: 'Columbia', artist: 'Quevedo', query: 'Quevedo Columbia audio oficial', cover: 'https://img.youtube.com/vi/QeI2XmKTh0M/hqdefault.jpg' },
      { title: 'LALA', artist: 'Myke Towers', query: 'Myke Towers LALA audio oficial', cover: 'https://img.youtube.com/vi/gA_33S3e_Xg/hqdefault.jpg' },
      { title: 'LUNA', artist: 'Feid & ATL Jacob', query: 'Feid LUNA audio oficial', cover: 'https://img.youtube.com/vi/6T3oR1JzvhU/hqdefault.jpg' },
      { title: 'Classy 101', artist: 'Feid & Young Miko', query: 'Feid Classy 101 audio oficial', cover: 'https://img.youtube.com/vi/9x3b85k2u0M/hqdefault.jpg' }
    ];

    function cargarGrid() {
      const grid = document.getElementById('mainGrid');
      grid.innerHTML = '';

      cancionesTops.forEach(s => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => reproducirEntera(s.title, s.artist, s.query, s.cover);

        card.innerHTML = `
          <img src="${s.cover}">
          <div class="card-title">${s.title}</div>
          <div class="card-sub">${s.artist}</div>
        `;
        grid.appendChild(card);
      });
    }

    function reproducirEntera(title, artist, query, cover) {
      document.getElementById('pTitle').innerText = title;
      document.getElementById('pArtist').innerText = artist;
      
      if (cover) {
        document.getElementById('pCover').innerHTML = `<img src="${cover}">`;
      } else {
        document.getElementById('pCover').innerHTML = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-weight:bold;">V8</div>`;
      }

      // Incrusta el reproductor completo utilizando la búsqueda directa de YouTube
      const embedUrl = `https://www.youtube-nocookie.com/embed?listType=search&list=${encodeURIComponent(query)}&autoplay=1`;
      document.getElementById('ytContainer').innerHTML = `<iframe src="${embedUrl}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    }

    function buscarCancionEntera() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;

      // Reproduce la búsqueda ingresada de inmediato y sin límite de tiempo
      reproducirEntera(q, 'Búsqueda de YouTube', `${q} audio oficial`, null);
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarGrid();
    });
  </script>
</body>
</html>
