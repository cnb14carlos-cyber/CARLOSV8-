<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarlosV8 - Music Streaming</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Circular', 'Segoe UI', Arial, sans-serif; }
    body { background-color: #000; color: #fff; display: grid; grid-template-rows: 1fr auto; height: 100vh; overflow: hidden; }

    /* Layout principal */
    .app-container { display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 90px); gap: 8px; padding: 8px; }

    /* Sidebar */
    .sidebar { background-color: #121212; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #1DB954; object-fit: cover; }
    .brand h2 { color: #1DB954; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    
    .menu-group { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
    .menu-item { color: #b3b3b3; text-decoration: none; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
    .menu-item:hover { color: #fff; }

    /* Main Content */
    .main-content { background-color: #121212; border-radius: 8px; padding: 20px; overflow-y: auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .search-box { display: flex; gap: 10px; flex-grow: 1; max-width: 500px; }
    .search-box input { width: 100%; padding: 12px 20px; border-radius: 50px; border: none; background: #242424; color: white; outline: none; font-size: 14px; }
    .search-box button { background: #1DB954; border: none; padding: 12px 24px; border-radius: 50px; color: black; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .search-box button:hover { transform: scale(1.04); background: #1ed760; }

    /* Grid de canciones */
    .section-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #fff; }
    .grid-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    .card { background: #181818; padding: 16px; border-radius: 8px; cursor: pointer; transition: background 0.3s; position: relative; }
    .card:hover { background: #282828; }
    .card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; margin-bottom: 12px; }
    .card-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
    .card-author { font-size: 12px; color: #a7a7a7; }

    /* Player Bar Inferior */
    .player-bar { background-color: #000; height: 90px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-top: 1px solid #282828; }
    .current-track { display: flex; align-items: center; gap: 12px; width: 30%; }
    .current-track-info h4 { font-size: 14px; color: #fff; }
    .current-track-info p { font-size: 12px; color: #a7a7a7; }
    audio { width: 40%; height: 40px; filter: invert(100%) hue-rotate(90deg); }

    /* Login Modal */
    .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .login-card { background: #181818; padding: 40px; border-radius: 12px; text-align: center; width: 350px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #282828; }
    .login-card img { width: 85px; height: 85px; border-radius: 50%; margin: 0 auto 5px auto; border: 2px solid #1DB954; object-fit: cover; }
    .login-card h2 { color: #1DB954; font-size: 26px; }
    .login-card p { font-size: 13px; color: #b3b3b3; margin-bottom: 5px; }
    .login-card input { padding: 12px; border-radius: 6px; border: 1px solid #333; background: #242424; color: white; outline: none; }
    .login-card button.btn-main { background: #1DB954; color: black; border: none; padding: 12px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 5px; }
    .login-card button.btn-main:hover { transform: scale(1.03); background: #1ed760; }
    .login-card button.btn-guest { background: transparent; color: #b3b3b3; border: 1px solid #333; padding: 10px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .login-card button.btn-guest:hover { background: #242424; color: #fff; border-color: #1DB954; }
  </style>
</head>
<body>

  <!-- Modal de Inicio de Sesión -->
  <div id="loginModal" class="login-overlay">
    <div class="login-card">
      <img src="logo.jpg" alt="CarlosV8 Logo" onerror="this.src='logo.jpg'">
      <h2>CarlosV8</h2>
      <p>Accede para escuchar tu música</p>
      <input type="text" id="usernameInput" placeholder="Nombre de usuario">
      <input type="password" id="passwordInput" placeholder="Contraseña">
      <button class="btn-main" onclick="iniciarSesion()">Iniciar Sesión</button>
      <button class="btn-guest" onclick="iniciarInvitado()">👤 Iniciar como invitado</button>
    </div>
  </div>

  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="brand">
        <img src="logo.jpg" alt="CarlosV8 Logo" onerror="this.src='logo.jpg'">
        <h2>CarlosV8</h2>
      </div>
      <div class="menu-group">
        <a class="menu-item">🏠 Inicio</a>
        <a class="menu-item">🔍 Buscar</a>
        <a class="menu-item">📚 Tu biblioteca</a>
      </div>
    </div>

    <!-- Panel Principal -->
    <div class="main-content">
      <div class="header-bar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="¿Qué quieres escuchar hoy?" onkeypress="if(event.key==='Enter') buscarMusica()">
          <button onclick="buscarMusica()">Buscar</button>
        </div>
      </div>

      <div class="section-title" id="sectionTitle">Canciones populares</div>
      <div id="results" class="grid-results">
        <p style="color: #b3b3b3;">Busca a tus artistas o canciones favoritas en el buscador para empezar a escuchar gratis y sin anuncios.</p>
      </div>
    </div>
  </div>

  <!-- Reproductor Inferior -->
  <div class="player-bar">
    <div class="current-track">
      <div class="current-track-info">
        <h4 id="nowPlayingTitle">Selecciona una canción</h4>
        <p id="nowPlayingArtist">-</p>
      </div>
    </div>
    
    <audio id="audioPlayer" controls autoplay></audio>
    <div style="width: 20%;"></div>
  </div>

  <script>
    const API_URL = 'https://pipedapi.kavin.rocks';

    window.onload = function() {
      const usuarioGuardado = localStorage.getItem('usuario_carlosv8');
      if (usuarioGuardado) {
        ocultarLogin(usuarioGuardado);
      }
    };

    function iniciarSesion() {
      const usuario = document.getElementById('usernameInput').value;
      if (usuario.trim() === '') {
        alert('Por favor, escribe un nombre de usuario');
        return;
      }
      localStorage.setItem('usuario_carlosv8', usuario);
      ocultarLogin(usuario);
    }

    function iniciarInvitado() {
      const usuario = 'Invitado';
      localStorage.setItem('usuario_carlosv8', usuario);
      ocultarLogin(usuario);
    }

    function ocultarLogin(usuario) {
      document.getElementById('loginModal').style.display = 'none';
      const sidebar = document.querySelector('.sidebar');
      const userBlock = document.createElement('div');
      userBlock.style.cssText = 'margin-top: auto; padding-top: 20px; border-top: 1px solid #282828; display: flex; align-items: center; justify-content: space-between;';
      userBlock.innerHTML = `
        <div>
          <p style="font-size: 14px; font-weight: bold; color: #fff;">👤 ${usuario}</p>
          <a onclick="cerrarSesion()" style="color: #e74c3c; font-size: 12px; cursor: pointer;">Cerrar sesión</a>
        </div>
      `;
      sidebar.appendChild(userBlock);
    }

    function cerrarSesion() {
      localStorage.removeItem('usuario_carlosv8');
      location.reload();
    }

    async function buscarMusica() {
      const query = document.getElementById('searchInput').value;
      if (!query) return;

      document.getElementById('sectionTitle').innerText = `Resultados para "${query}"`;
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<p style="color: #b3b3b3;">Cargando canciones...</p>';

      try {
        const response = await fetch(`${API_URL}/search?q=${encodeURIComponent(query)}&filter=music_songs`);
        const data = await response.json();
        
        resultsDiv.innerHTML = '';

        if (!data.items || data.items.length === 0) {
          resultsDiv.innerHTML = '<p style="color: #b3b3b3;">No se encontraron resultados.</p>';
          return;
        }

        data.items.slice(0, 12).forEach(item => {
          const videoId = item.url.split('v=')[1];
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => reproducirCancion(videoId, item.title, item.uploaderName);

          card.innerHTML = `
            <img src="${item.thumbnail}" alt="Cover" onerror="this.src='logo.jpg'">
            <div class="card-title">${item.title}</div>
            <div class="card-author">${item.uploaderName}</div>
          `;
          resultsDiv.appendChild(card);
        });
      } catch (err) {
        resultsDiv.innerHTML = '<p style="color: #e74c3c;">Error al conectar con la API. Inténtalo de nuevo.</p>';
      }
    }

    async function reproducirCancion(videoId, title, artist) {
      document.getElementById('nowPlayingTitle').innerText = title;
      document.getElementById('nowPlayingArtist').innerText = artist;

      try {
        const response = await fetch(`${API_URL}/streams/${videoId}`);
        const data = await response.json();

        const audioStream = data.audioStreams.find(stream => stream.mimeType.includes('audio/webm') || stream.mimeType.includes('audio/mp4'));
        
        if (audioStream) {
          const player = document.getElementById('audioPlayer');
          player.src = audioStream.url;
          player.play();
        }
      } catch (err) {
        alert('No se pudo cargar el audio de esta canción.');
      }
    }
  </script>
</body>
</html>
