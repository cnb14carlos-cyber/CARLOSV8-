<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarlosV8 - Music</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0f0f0f; color: #ffffff; min-height: 100vh; padding-bottom: 110px; }

    .app-container { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; max-width: 1300px; margin: 0 auto; }

    /* Menú Lateral */
    .sidebar { width: 230px; background: #181818; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; height: fit-content; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; }
    .logo-v8 { width: 40px; height: 40px; background: #1DB954; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; }
    .brand h2 { color: #1DB954; font-size: 22px; }

    .menu-btn { background: transparent; border: none; color: #b3b3b3; padding: 12px 14px; border-radius: 8px; font-weight: bold; font-size: 14px; text-align: left; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
    .menu-btn:hover, .menu-btn.active { background: #282828; color: #fff; }

    /* Panel Principal */
    .main-content { flex: 1; min-width: 300px; background: #181818; border-radius: 12px; padding: 24px; }
    .search-box { display: flex; gap: 10px; max-width: 500px; margin-bottom: 20px; }
    .search-box input { flex: 1; padding: 12px 18px; border-radius: 50px; border: 1px solid #333; background: #242424; color: #fff; outline: none; }
    .search-box button { background: #1DB954; border: none; padding: 12px 22px; border-radius: 50px; font-weight: bold; cursor: pointer; color: #000; }

    .section-title { font-size: 22px; font-weight: bold; margin: 20px 0 14px 0; color: #fff; }
    .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }

    /* Tarjetas de Canciones y Artistas */
    .card { background: #222; padding: 12px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    .card:hover { background: #2e2e2e; transform: translateY(-3px); }
    .card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; margin-bottom: 8px; background: #333; }
    .card-artist-img { border-radius: 50% !important; }
    .card-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 11px; color: #aaa; margin-top: 3px; }

    /* Reproductor Inferior */
    .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 90px; background: #121212; border-top: 1px solid #282828; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; }
    .track-info { display: flex; align-items: center; gap: 12px; width: 30%; }
    .track-info img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: #222; }
    audio { width: 45%; height: 40px; filter: invert(100%) hue-rotate(90deg); }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Menú Lateral N° 2 -->
    <div class="sidebar">
      <div class="brand" onclick="mostrarInicio()">
        <div class="logo-v8">V8</div>
        <h2>CarlosV8</h2>
      </div>
      <button class="menu-btn active" id="btnInicio" onclick="mostrarInicio()">🏠 Inicio</button>
      <button class="menu-btn" id="btnBuscar" onclick="enfocarBuscador()">🔍 Buscar</button>
      <button class="menu-btn" id="btnBiblioteca" onclick="mostrarBiblioteca()">📚 Tu biblioteca</button>
    </div>

    <!-- Panel Principal -->
    <div class="main-content">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="¿Qué quieres escuchar hoy?" onkeypress="if(event.key==='Enter') buscarMusica()">
        <button onclick="buscarMusica()">Buscar</button>
      </div>

      <!-- Vista de Inicio N° 1 -->
      <div id="viewInicio">
        <h3 class="section-title">🔥 Canciones más Top</h3>
        <div class="grid-layout" id="topSongsGrid"></div>

        <h3 class="section-title">⭐ Artistas más Top</h3>
        <div class="grid-layout" id="topArtistsGrid"></div>
      </div>

      <!-- Vista de Resultados y Biblioteca N° 3 -->
      <div id="viewDynamic" style="display: none;">
        <h3 class="section-title" id="dynamicTitle">Resultados</h3>
        <div class="grid-layout" id="dynamicGrid"></div>
      </div>
    </div>
  </div>

  <!-- Barra de Reproducción -->
  <div class="player-bar">
    <div class="track-info">
      <img id="playerCover" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><rect width='100%' height='100%' fill='%23222'/></svg>" alt="Cover">
      <div>
        <h4 id="nowTitle" style="font-size: 14px;">Selecciona una canción</h4>
        <p id="nowArtist" style="font-size: 12px; color: #aaa;">CarlosV8 Player</p>
      </div>
    </div>
    <audio id="audioPlayer" controls autoplay></audio>
  </div>

  <script>
    const APP_NAME = 'CarlosV8Player';
    const API_AUDIUS = 'https://discoveryprovider.audius.co/v1';

    window.onload = function() {
      cargarInicio();
    };

    function activarBoton(id) {
      document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // 1. Cargar Inicio: Canciones y Artistas Tops
    async function cargarInicio() {
      const songsGrid = document.getElementById('topSongsGrid');
      const artistsGrid = document.getElementById('topArtistsGrid');
      songsGrid.innerHTML = '<p style="color:#aaa;">Cargando canciones top...</p>';
      artistsGrid.innerHTML = '<p style="color:#aaa;">Cargando artistas top...</p>';

      try {
        const res = await fetch(`${API_AUDIUS}/tracks/trending?app_name=${APP_NAME}`);
        const data = await res.json();
        const tracks = data.data || [];

        // Rellenar Canciones Top
        songsGrid.innerHTML = '';
        tracks.slice(0, 6).forEach(track => {
          const cover = track.artwork ? track.artwork['150x150'] : 'https://via.placeholder.com/150/222/1DB954?text=Music';
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => reproducir(track.id, track.title, track.user.name, cover);
          card.innerHTML = `
            <img src="${cover}" alt="Cover">
            <div class="card-title">${track.title}</div>
            <div class="card-sub">${track.user.name}</div>
          `;
          songsGrid.appendChild(card);
        });

        // Rellenar Artistas Top
        artistsGrid.innerHTML = '';
        const artistasUnicos = [];
        const idsVistos = new Set();

        tracks.forEach(t => {
          if (t.user && !idsVistos.has(t.user.id)) {
            idsVistos.add(t.user.id);
            artistasUnicos.push(t.user);
          }
        });

        artistasUnicos.slice(0, 6).forEach(artist => {
          const photo = artist.profile_picture ? artist.profile_picture['150x150'] : 'https://via.placeholder.com/150/333/ffffff?text=Artist';
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => {
            document.getElementById('searchInput').value = artist.name;
            buscarMusica();
          };
          card.innerHTML = `
            <img src="${photo}" class="card-artist-img" alt="Artist">
            <div class="card-title" style="text-align:center;">${artist.name}</div>
            <div class="card-sub" style="text-align:center;">Artista</div>
          `;
          artistsGrid.appendChild(card);
        });

      } catch (e) {
        songsGrid.innerHTML = '<p style="color:#e74c3c;">No se pudieron cargar los datos de la API.</p>';
        artistsGrid.innerHTML = '';
      }
    }

    // 2. Control del Menú de Navegación
    function mostrarInicio() {
      activarBoton('btnInicio');
      document.getElementById('viewInicio').style.display = 'block';
      document.getElementById('viewDynamic').style.display = 'none';
    }

    function enfocarBuscador() {
      activarBoton('btnBuscar');
      const input = document.getElementById('searchInput');
      input.focus();
      input.select();
    }

    function mostrarBiblioteca() {
      activarBoton('btnBiblioteca');
      document.getElementById('viewInicio').style.display = 'none';
      document.getElementById('viewDynamic').style.display = 'block';
      document.getElementById('dynamicTitle').innerText = '📚 Tu biblioteca (Historial de reproducciones)';

      const playlist = JSON.parse(localStorage.getItem('biblioteca_carlosv8') || '[]');
      const grid = document.getElementById('dynamicGrid');
      grid.innerHTML = '';

      if (playlist.length === 0) {
        grid.innerHTML = '<p style="color:#aaa;">Tu biblioteca está vacía. Reproduce canciones para que se guarden aquí.</p>';
        return;
      }

      playlist.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => reproducir(item.id, item.title, item.artist, item.cover, false);
        card.innerHTML = `
          <img src="${item.cover}" alt="Cover">
          <div class="card-title">${item.title}</div>
          <div class="card-sub">${item.artist}</div>
        `;
        grid.appendChild(card);
      });
    }

    // 3. Buscador resistente a errores (Doble servidor de respaldo)
    async function buscarMusica() {
      activarBoton('btnBuscar');
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      document.getElementById('viewInicio').style.display = 'none';
      document.getElementById('viewDynamic').style.display = 'block';
      document.getElementById('dynamicTitle').innerText = `Resultados para "${query}"`;

      const grid = document.getElementById('dynamicGrid');
      grid.innerHTML = '<p style="color:#aaa;">Buscando en la base de datos...</p>';

      try {
        // Intento 1: API de Audius
        const res = await fetch(`${API_AUDIUS}/tracks/search?query=${encodeURIComponent(query)}&app_name=${APP_NAME}`);
        const data = await res.json();
        
        if (data.data && data.data.length > 0) {
          mostrarResultadosAudius(data.data);
          return;
        }
        throw new Error("Sin resultados en Audius");
      } catch (err) {
        // Intento 2: Respaldo con iTunes API
        buscarEnItunes(query);
      }
    }

    function mostrarResultadosAudius(lista) {
      const grid = document.getElementById('dynamicGrid');
      grid.innerHTML = '';
      lista.slice(0, 12).forEach(track => {
        const cover = track.artwork ? track.artwork['150x150'] : 'https://via.placeholder.com/150/222/ffffff?text=Track';
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => reproducir(track.id, track.title, track.user.name, cover);
        card.innerHTML = `
          <img src="${cover}" alt="Cover">
          <div class="card-title">${track.title}</div>
          <div class="card-sub">${track.user.name}</div>
        `;
        grid.appendChild(card);
      });
    }

    async function buscarEnItunes(query) {
      const grid = document.getElementById('dynamicGrid');
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=12`);
        const data = await res.json();
        grid.innerHTML = '';

        if (!data.results || data.results.length === 0) {
          grid.innerHTML = '<p style="color:#aaa;">No se encontraron resultados.</p>';
          return;
        }

        data.results.forEach(track => {
          const cover = track.artworkUrl100.replace('100x100bb', '300x300bb');
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => reproducirDirecto(track.previewUrl, track.trackName, track.artistName, cover, track.trackId);
          card.innerHTML = `
            <img src="${cover}" alt="Cover">
            <div class="card-title">${track.trackName}</div>
            <div class="card-sub">${track.artistName}</div>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        grid.innerHTML = '<p style="color:#e74c3c;">Error de conexión. Revisa tu conexión a internet.</p>';
      }
    }

    // Reproducción y Guardado en Biblioteca
    function reproducir(trackId, title, artist, cover, guardar = true) {
      document.getElementById('nowTitle').innerText = title;
      document.getElementById('nowArtist').innerText = artist;
      document.getElementById('playerCover').src = cover;

      const player = document.getElementById('audioPlayer');
      player.src = `${API_AUDIUS}/tracks/${trackId}/stream?app_name=${APP_NAME}`;
      player.play();

      if (guardar) guardarEnBiblioteca(trackId, title, artist, cover);
    }

    function reproducirDirecto(url, title, artist, cover, id) {
      document.getElementById('nowTitle').innerText = title;
      document.getElementById('nowArtist').innerText = artist;
      document.getElementById('playerCover').src = cover;

      const player = document.getElementById('audioPlayer');
      player.src = url;
      player.play();

      guardarEnBiblioteca(id, title, artist, cover);
    }

    function guardarEnBiblioteca(id, title, artist, cover) {
      let playlist = JSON.parse(localStorage.getItem('biblioteca_carlosv8') || '[]');
      if (!playlist.some(item => item.id === id)) {
        playlist.unshift({ id, title, artist, cover });
        localStorage.setItem('biblioteca_carlosv8', JSON.stringify(playlist.slice(0, 20)));
      }
    }
  </script>
</body>
</html>
