<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarlosV8 - Reproductor de Música Completa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #ffffff; padding-bottom: 110px; min-height: 100vh; }

    header { background: #000; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #282828; }
    .logo { font-size: 20px; font-weight: 800; color: #1DB954; }

    .search-box { display: flex; gap: 10px; padding: 20px; max-width: 600px; margin: 0 auto; }
    .search-box input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #333; background: #222; color: #fff; font-size: 14px; outline: none; }
    .search-box input:focus { border-color: #1DB954; }
    .search-box button { background: #1DB954; color: #000; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; cursor: pointer; }

    .container { padding: 0 20px; max-width: 1000px; margin: 0 auto; }
    .title { font-size: 20px; font-weight: 800; margin: 15px 0; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .card { background: #181818; padding: 14px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .card:hover { background: #282828; transform: translateY(-3px); }
    .card img { width: 100%; aspect-ratio: 1; border-radius: 6px; object-fit: cover; background: #222; }
    .card-title { font-size: 14px; font-weight: bold; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 12px; color: #aaa; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .player-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 90px;
      background: #000; border-top: 1px solid #282828; display: flex;
      align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100;
    }
    .track-info { display: flex; align-items: center; gap: 12px; width: 40%; }
    .track-info img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: #222; }
    .track-text h4 { font-size: 14px; font-weight: bold; }
    .track-text p { font-size: 12px; color: #aaa; }

    audio { width: 50%; max-width: 400px; outline: none; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🎵 CarlosV8 Player</div>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Escribe el nombre de un artista o canción..." onkeypress="if(event.key==='Enter') buscarMusica()">
    <button onclick="buscarMusica()">Buscar</button>
  </div>

  <div class="container">
    <div class="title" id="sectionTitle">🔥 Canciones recomendadas (Completas)</div>
    <div class="grid" id="songsGrid">
      <p style="color:#aaa;">Cargando música...</p>
    </div>
  </div>

  <footer class="player-bar">
    <div class="track-info">
      <img id="playerCover" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100%' height='100%' fill='%23222'/></svg>">
      <div class="track-text">
        <h4 id="playerTitle">Selecciona una canción</h4>
        <p id="playerArtist">CarlosV8 Player</p>
      </div>
    </div>
    <audio id="audioElement" controls autoplay></audio>
  </footer>

  <script>
    const appName = "CarlosV8PlayerApp";

    // Al cargar la página, busca canciones populares en la API
    document.addEventListener('DOMContentLoaded', () => {
      cargarCancionesTop();
    });

    async function cargarCancionesTop() {
      try {
        const res = await fetch(`https://discoveryprovider.audius.co/v1/tracks/trending?app_name=${appName}&limit=12`);
        const data = await res.json();
        mostrarResultados(data.data);
      } catch (err) {
        document.getElementById('songsGrid').innerHTML = '<p style="color:#ff5555;">Error al cargar las canciones. Comprueba tu conexión a Internet.</p>';
      }
    }

    async function buscarMusica() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      document.getElementById('sectionTitle').innerText = `Resultados para "${query}"`;
      document.getElementById('songsGrid').innerHTML = '<p style="color:#aaa;">Buscando canciones...</p>';

      try {
        const res = await fetch(`https://discoveryprovider.audius.co/v1/tracks/search?query=${encodeURIComponent(query)}&app_name=${appName}`);
        const data = await res.json();
        mostrarResultados(data.data);
      } catch (err) {
        document.getElementById('songsGrid').innerHTML = '<p style="color:#ff5555;">Error en la búsqueda.</p>';
      }
    }

    function mostrarResultados(tracks) {
      const grid = document.getElementById('songsGrid');
      grid.innerHTML = '';

      if (!tracks || tracks.length === 0) {
        grid.innerHTML = '<p style="color:#aaa;">No se encontraron canciones.</p>';
        return;
      }

      tracks.forEach(track => {
        const streamUrl = `https://discoveryprovider.audius.co/v1/tracks/${track.id}/stream?app_name=${appName}`;
        const coverUrl = track.artwork ? track.artwork['150x150'] : 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100%" height="100%" fill="%23333"/></svg>';
        
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => reproducirCancion(streamUrl, track.title, track.user.name, coverUrl);
        card.innerHTML = `
          <img src="${coverUrl}">
          <div class="card-title">${track.title}</div>
          <div class="card-sub">${track.user.name}</div>
        `;
        grid.appendChild(card);
      });
    }

    function reproducirCancion(streamUrl, title, artist, cover) {
      document.getElementById('playerTitle').innerText = title;
      document.getElementById('playerArtist').innerText = artist;
      document.getElementById('playerCover').src = cover;

      const audio = document.getElementById('audioElement');
      audio.src = streamUrl;
      audio.play();
    }
  </script>
</body>
</html>
