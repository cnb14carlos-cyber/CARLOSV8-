<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarlosV8 - Music</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0f0f0f; color: #ffffff; min-height: 100vh; padding-bottom: 110px; }

    .app-container { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; max-width: 1300px; margin: 0 auto; }

    /* Menú Lateral */
    .sidebar { width: 230px; background: #181818; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; height: fit-content; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; }
    .logo-v8 { width: 40px; height: 40px; background: #1DB954; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; }
    .brand h2 { color: #1DB954; font-size: 22px; }

    .menu-btn { background: transparent; border: none; color: #b3b3b3; padding: 12px 14px; border-radius: 8px; font-weight: bold; font-size: 14px; text-align: left; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
    .menu-btn:hover, .menu-btn.active { background: #282828; color: #fff; }

    /* Panel Principal */
    .main-content { flex: 1; min-width: 300px; background: #181818; border-radius: 12px; padding: 24px; }
    .search-box { display: flex; gap: 10px; max-width: 500px; margin-bottom: 20px; }
    .search-box input { flex: 1; padding: 12px 18px; border-radius: 50px; border: 1px solid #333; background: #242424; color: #fff; outline: none; }
    .search-box button { background: #1DB954; border: none; padding: 12px 22px; border-radius: 50px; font-weight: bold; cursor: pointer; color: #000; }

    .section-title { font-size: 22px; font-weight: bold; margin: 20px 0 14px 0; color: #fff; }
    .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }

    /* Tarjetas */
    .card { background: #222; padding: 12px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    .card:hover { background: #2e2e2e; transform: translateY(-3px); }
    .card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; margin-bottom: 8px; background: #333; }
    .card-artist-img { border-radius: 50% !important; }
    .card-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 11px; color: #aaa; margin-top: 3px; }

    /* Reproductor Inferior */
    .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 90px; background: #121212; border-top: 1px solid #282828; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; }
    .track-info { display: flex; align-items: center; gap: 12px; width: 30%; }
    .track-info img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: #222; }
    audio { width: 45%; height: 40px; filter: invert(100%) hue-rotate(90deg); }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Menú Lateral -->
    <div class="sidebar">
      <div class="brand" onclick="mostrarInicio()">
        <div class="logo-v8">V8</div>
        <h2>CarlosV8</h2>
      </div>
      <button class="menu-btn active" id="btnInicio" onclick="mostrarInicio()">🏠 Inicio</button>
      <button class="menu-btn" id="btnBuscar" onclick="enfocarBuscador()">🔍 Buscar</button>
      <button class="menu-btn" id="btnBiblioteca" onclick="mostrarBiblioteca()">📚 Tu biblioteca</button>
    </div>

    <!-- Panel Principal -->
    <div class="main-content">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="¿Qué quieres escuchar hoy?" onkeypress="if(event.key==='Enter') realizarBusqueda()">
        <button onclick="realizarBusqueda()">Buscar</button>
      </div>

      <!-- Vista de Inicio -->
      <div id="viewInicio">
        <h3 class="section-title">🔥 Canciones más Top</h3>
        <div class="grid-layout" id="topSongsGrid"></div>

        <h3 class="section-title">⭐ Artistas más Top</h3>
        <div class="grid-layout" id="topArtistsGrid"></div>
      </div>

      <!-- Vista Dinámica (Búsqueda / Biblioteca) -->
      <div id="viewDynamic" style="display: none;">
        <h3 class="section-title" id="dynamicTitle">Resultados</h3>
        <div class="grid-layout" id="dynamicGrid"></div>
      </div>
    </div>
  </div>

  <!-- Barra de Reproducción -->
  <div class="player-bar">
    <div class="track-info">
      <div id="coverBox" style="width: 48px; height: 48px; background: #222; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px;">🎵</div>
      <div>
        <h4 id="nowTitle" style="font-size: 14px;">Selecciona una canción</h4>
        <p id="nowArtist" style="font-size: 12px; color: #aaa;">CarlosV8 Player</p>
      </div>
    </div>
    <audio id="audioPlayer" controls autoplay></audio>
  </div>

  <script>
    let scriptTag = null;

    window.onload = function() {
      cargarInicio();
    };

    function activarBoton(id) {
      document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    /* 1. Cargar Inicio sin errores de CORS */
    function cargarInicio() {
      activarBoton('btnInicio');
      document.getElementById('viewInicio').style.display = 'block';
      document.getElementById('viewDynamic').style.display = 'none';

      // Petición JSONP para Canciones Top
      hacerPeticionJSONP('https://itunes.apple.com/search?term=latin+top+hits&entity=song&limit=6&callback=renderTopSongs');
      
      // Petición JSONP para Artistas Top
      hacerPeticionJSONP('https://itunes.apple.com/search?term=duki+quevedo+bizarrap+feid&entity=song&limit=6&callback=renderTopArtists');
    }

    window.renderTopSongs = function(data) {
      const grid = document.getElementById('topSongsGrid');
      grid.innerHTML = '';
      if (!data.results) return;

      data.results.forEach(track => {
        const cover = track.artworkUrl100.replace('100x100bb', '300x300bb');
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => reproducir(track.previewUrl, track.trackName, track.artistName, cover, track.trackId);
        card.innerHTML = `
          <img src="${cover}" alt="Cover">
          <div class="card-title">${track.trackName}</div>
          <div class="card-sub">${track.artistName}</div>
        `;
        grid.appendChild(card);
      });
    };

    window.renderTopArtists = function(data) {
      const grid = document.getElementById('topArtistsGrid');
      grid.innerHTML = '';
      if (!data.results) return;

      data.results.forEach(track => {
        const cover = track.artworkUrl100.replace('100x100bb', '300x300bb');
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => {
          document.getElementById('searchInput').value = track.artistName;
          realizarBusqueda();
        };
        card.innerHTML = `
          <img src="${cover}" class="card-artist-img" alt="Artist">
          <div class="card-title" style="text-align:center;">${track.artistName}</div>
          <div class="card-sub" style="text-align:center;">Artista</div>
        `;
        grid.appendChild(card);
      });
    };

    /* 2. Buscador 100% Inmune a Bloqueos */
    function realizarBusqueda() {
      activarBoton('btnBuscar');
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      document.getElementById('viewInicio').style.display = 'none';
      document.getElementById('viewDynamic').style.display = 'block';
      document.getElementById('dynamicTitle').innerText = `Resultados para "${query}"`;

      const grid = document.getElementById('dynamicGrid');
      grid.innerHTML = '<p style="color:#aaa;">Cargando resultados...</p>';

      hacerPeticionJSONP(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=18&callback=renderBusqueda`);
    }

    window.renderBusqueda = function(data) {
      const grid = document.getElementById('dynamicGrid');
      grid.innerHTML = '';

      if (!data.results || data.results.length === 0) {
        grid.innerHTML = '<p style="color:#aaa;">No se encontraron resultados para esta búsqueda.</p>';
        return;
      }

      data.results.forEach(track => {
        const cover = track.artworkUrl100.replace('100x100bb', '300x300bb');
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => reproducir(track.previewUrl, track.trackName, track.artistName, cover, track.trackId);
        card.innerHTML = `
          <img src="${cover}" alt="Cover">
          <div class="card-title">${track.trackName}</div>
          <div class="card-sub">${track.artistName}</div>
        `;
        grid.appendChild(card);
      });
    };

    /* 3. Menú de Navegación */
    function mostrarInicio() {
      cargarInicio();
    }

    function enfocarBuscador() {
      activarBoton('btnBuscar');
      const input = document.getElementById('searchInput');
      input.focus();
      input.select();
    }

    function mostrarBiblioteca() {
      activarBoton('btnBiblioteca');
      document.getElementById('viewInicio').style.display = 'none';
      document.getElementById('viewDynamic').style.display = 'block';
      document.getElementById('dynamicTitle').innerText = '📚 Tu biblioteca';

      const playlist = JSON.parse(localStorage.getItem('carlosv8_favs') || '[]');
      const grid = document.getElementById('dynamicGrid');
      grid.innerHTML = '';

      if (playlist.length === 0) {
        grid.innerHTML = '<p style="color:#aaa;">Tu biblioteca está vacía. Escucha canciones para guardarlas aquí automáticamente.</p>';
        return;
      }

      playlist.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => reproducir(item.url, item.title, item.artist, item.cover, item.id, false);
        card.innerHTML = `
          <img src="${item.cover}" alt="Cover">
          <div class="card-title">${item.title}</div>
          <div class="card-sub">${item.artist}</div>
        `;
        grid.appendChild(card);
      });
    }

    /* 4. Sistema de Reproducción y Guardado */
    function reproducir(url, title, artist, cover, id, guardar = true) {
      document.getElementById('nowTitle').innerText = title;
      document.getElementById('nowArtist').innerText = artist;
      
      const coverBox = document.getElementById('coverBox');
      coverBox.innerHTML = `<img src="${cover}" style="width:100%; height:100%; border-radius:6px; object-fit:cover;">`;

      const player = document.getElementById('audioPlayer');
      player.src = url;
      player.play();

      if (guardar) guardarEnBiblioteca(id, title, artist, cover, url);
    }

    function guardarEnBiblioteca(id, title, artist, cover, url) {
      let playlist = JSON.parse(localStorage.getItem('carlosv8_favs') || '[]');
      if (!playlist.some(item => item.id === id)) {
        playlist.unshift({ id, title, artist, cover, url });
        localStorage.setItem('carlosv8_favs', JSON.stringify(playlist.slice(0, 25)));
      }
    }

    /* Función Auxiliar para JSONP */
    function hacerPeticionJSONP(url) {
      if (scriptTag) scriptTag.remove();
      scriptTag = document.createElement('script');
      scriptTag.src = url;
      document.body.appendChild(scriptTag);
    }
  </script>
</body>
</html>
