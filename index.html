<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarlosV8 - Music Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #ffffff; min-height: 100vh; padding-bottom: 90px; }

    .app-container { display: flex; min-height: calc(100vh - 90px); }

    /* Menú lateral */
    .sidebar {
      width: 220px; background: #000000; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; flex-shrink: 0;
    }
    .brand { font-size: 20px; font-weight: 800; color: #1DB954; }
    .nav-btn {
      background: #282828; border: none; color: #ffffff; padding: 10px 14px;
      border-radius: 6px; font-weight: 600; text-align: left; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px;
    }

    /* Contenido Principal */
    .main-content { flex: 1; padding: 30px; background: #121212; }
    .section-title { font-size: 22px; font-weight: 800; margin-bottom: 20px; color: #ffffff; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
    .card { background: #181818; padding: 14px; border-radius: 10px; cursor: pointer; transition: background 0.2s, transform 0.2s; }
    .card:hover { background: #252525; transform: translateY(-3px); }
    .card img { width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; background: #282828; display: block; }
    .card-title { font-weight: bold; margin-top: 10px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .card-sub { color: #aaaaaa; font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Reproductor Inferior */
    .player-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 90px;
      background: #000000; border-top: 1px solid #1f1f1f; display: flex;
      align-items: center; justify-content: space-between; padding: 0 24px; z-index: 100;
    }
    .track-info { display: flex; align-items: center; gap: 14px; }
    .cover-badge {
      width: 48px; height: 48px; background: #1DB954; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; color: #000; flex-shrink: 0; overflow: hidden;
    }
    .cover-badge img { width: 100%; height: 100%; object-fit: cover; }
    .track-text { display: flex; flex-direction: column; }
    .track-title { font-weight: bold; font-size: 14px; color: #ffffff; }
    .track-artist { color: #aaaaaa; font-size: 12px; margin-top: 2px; }

    .yt-container { width: 260px; height: 70px; border-radius: 8px; overflow: hidden; background: #000; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="brand">CarlosV8</div>
      <button class="nav-btn">🏠 Inicio</button>
    </aside>

    <main class="main-content">
      <h2 class="section-title">🔥 Canciones Completas (YouTube Directo)</h2>
      <div class="grid" id="gridCanciones"></div>
    </main>
  </div>

  <footer class="player-bar">
    <div class="track-info">
      <div class="cover-badge" id="coverContainer">V8</div>
      <div class="track-text">
        <div class="track-title" id="title">Selecciona una canción</div>
        <div class="track-artist" id="artist">CarlosV8 Player</div>
      </div>
    </div>
    <div class="yt-container">
      <iframe id="ytPlayer" allow="autoplay; encrypted-media"></iframe>
    </div>
  </footer>

  <script>
    const canciones = [
      { title: 'Columbia', artist: 'Quevedo', ytId: 'm49a2gA2LNo', cover: 'https://i.ytimg.com/vi/m49a2gA2LNo/hqdefault.jpg' },
      { title: 'LALA', artist: 'Myke Towers', ytId: 'g202Bv-N4qA', cover: 'https://i.ytimg.com/vi/g202Bv-N4qA/hqdefault.jpg' },
      { title: 'Classy 101', artist: 'Feid & Young Miko', ytId: 'sJ92c_Z6x3s', cover: 'https://i.ytimg.com/vi/sJ92c_Z6x3s/hqdefault.jpg' },
      { title: 'LUNA', artist: 'Feid', ytId: 'sL2B734a2e0', cover: 'https://i.ytimg.com/vi/sL2B734a2e0/hqdefault.jpg' },
      { title: 'MONACO', artist: 'Bad Bunny', ytId: 'f0X90C8eA4M', cover: 'https://i.ytimg.com/vi/f0X90C8eA4M/hqdefault.jpg' }
    ];

    function cargarGrid() {
      const grid = document.getElementById('gridCanciones');
      grid.innerHTML = '';
      canciones.forEach(s => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => reproducirYouTube(s.ytId, s.title, s.artist, s.cover);
        card.innerHTML = `
          <img src="${s.cover}" referrerpolicy="no-referrer">
          <div class="card-title">${s.title}</div>
          <div class="card-sub">${s.artist}</div>
        `;
        grid.appendChild(card);
      });
    }

    function reproducirYouTube(ytId, title, artist, cover) {
      document.getElementById('title').innerText = title;
      document.getElementById('artist').innerText = artist;
      
      const coverBox = document.getElementById('coverContainer');
      coverBox.innerHTML = `<img src="${cover}">`;

      // Carga el vídeo directo en el reproductor de YouTube
      document.getElementById('ytPlayer').src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
    }

    document.addEventListener('DOMContentLoaded', cargarGrid);
  </script>
</body>
</html>
