<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarlosV8 - Music Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #ffffff; min-height: 100vh; padding-bottom: 95px; }

    .app-container { display: flex; min-height: calc(100vh - 95px); }

    /* Menú lateral */
    .sidebar {
      width: 230px; background: #000000; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0;
    }
    .brand { font-size: 22px; font-weight: 800; color: #1DB954; margin-bottom: 10px; }
    .nav-btn {
      background: transparent; border: none; color: #b3b3b3; padding: 12px 14px;
      border-radius: 8px; font-weight: bold; text-align: left; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 10px; transition: 0.2s;
    }
    .nav-btn:hover, .nav-btn.active { color: #ffffff; background: #282828; }

    /* Contenido Principal */
    .main-content { flex: 1; padding: 24px; background: #121212; overflow-y: auto; }
    
    /* Buscador */
    .search-box { display: flex; gap: 10px; margin-bottom: 24px; background: #181818; padding: 16px; border-radius: 12px; border: 1px solid #282828; }
    .search-box input {
      flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #333; background: #222; color: #fff; font-size: 15px; outline: none;
    }
    .search-box button {
      background: #1DB954; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; color: #000; cursor: pointer; transition: 0.2s;
    }
    .search-box button:hover { background: #1ed760; }

    .section-title { font-size: 20px; font-weight: 800; margin: 20px 0 14px 0; color: #ffffff; }

    /* Grillas */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .card { background: #181818; padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; position: relative; }
    .card:hover { background: #282828; transform: translateY(-4px); }
    .card img { width: 100%; aspect-ratio: 1; border-radius: 6px; object-fit: cover; background: #282828; display: block; }
    .card-title { font-weight: bold; margin-top: 8px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .card-sub { color: #aaa; font-size: 11px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .add-btn {
      position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.75); border: none; color: #1DB954;
      font-size: 16px; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .add-btn:hover { background: #1DB954; color: #000; }

    .artist-card img { border-radius: 50% !important; }

    /* Reproductor Inferior */
    .player-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 95px;
      background: #000000; border-top: 1px solid #282828; display: flex;
      align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100;
    }
    .track-info { display: flex; align-items: center; gap: 12px; width: 35%; }
    .cover-box { width: 54px; height: 54px; background: #282828; border-radius: 6px; overflow: hidden; flex-shrink: 0; }
    .cover-box img { width: 100%; height: 100%; object-fit: cover; }
    .track-text { overflow: hidden; }
    .track-title { font-weight: bold; font-size: 14px; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { color: #aaaaaa; font-size: 12px; margin-top: 2px; }

    .player-controls { display: flex; align-items: center; gap: 15px; }
    audio { outline: none; height: 40px; width: 320px; }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="brand">CarlosV8</div>
      <button class="nav-btn active" id="btn-inicio" onclick="mostrarSeccion('inicio')">🏠 Inicio</button>
      <button class="nav-btn" id="btn-top-canciones" onclick="mostrarSeccion('top-canciones')">🔥 Top Canciones</button>
      <button class="nav-btn" id="btn-top-artistas" onclick="mostrarSeccion('top-artistas')">🎤 Top Artistas</button>
      <button class="nav-btn" id="btn-mi-lista" onclick="mostrarSeccion('mi-lista')">➕ Mi Playlist (<span id="countPlaylist">0</span>)</button>
    </aside>

    <main class="main-content">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Escribe cualquier canción o artista (ej: LALION, Bad Bunny...)" onkeypress="if(event.key==='Enter') buscar()">
        <button onclick="buscar()">Buscar</button>
      </div>

      <div id="seccionContenido">
        <h2 class="section-title" id="tituloPrincipal">🔥 Canciones Tops</h2>
        <div class="grid" id="gridCanciones"></div>

        <h2 class="section-title" id="tituloArtistas">🎤 Artistas Tops</h2>
        <div class="grid" id="gridArtistas"></div>
      </div>
    </main>
  </div>

  <footer class="player-bar">
    <div class="track-info">
      <div class="cover-box" id="coverContainer">
        <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#1DB954;font-weight:bold;">V8</div>
      </div>
      <div class="track-text">
        <div class="track-title" id="title">Selecciona una canción</div>
        <div class="track-artist" id="artist">CarlosV8 Player</div>
      </div>
    </div>
    <div class="player-controls">
      <audio id="audioPlayer" controls autoplay></audio>
    </div>
  </footer>

  <script>
    const topCancionesData = [
      { id: '1', title: 'MONACO', artist: 'Bad Bunny', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/bf/16/d6/bf16d6c3-1f19-9154-1a3b-24b553e1bf2c/197188981440.jpg/600x600bb.jpg', previewUrl: 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview116/v4/6c/df/0a/6cdf0a3a-2373-19cb-e4d0-47b2c5e52c80/mzaf_13303683510595568897.plus.aac.p.m4a' },
      { id: '2', title: 'Columbia', artist: 'Quevedo', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/6d/2c/18/6d2c18df-e53b-e0fa-9869-79f977c08b5f/8445162816911.jpg/600x600bb.jpg', previewUrl: 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview116/v4/c2/f7/68/c2f76816-0158-b610-8b4e-28beeb3cf38b/mzaf_14436894042838734026.plus.aac.p.m4a' },
      { id: '3', title: 'LALA', artist: 'Myke Towers', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/64/73/4f/64734f19-33b8-68f7-7b69-f81d1131c19b/190296238803.jpg/600x600bb.jpg', previewUrl: 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview116/v4/b8/b8/63/b8b863aa-8d02-2cb1-bf9d-f682bb1978eb/mzaf_11306660601614749385.plus.aac.p.m4a' },
      { id: '4', title: 'LUNA', artist: 'Feid & ATL Jacob', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/13/be/05/13be059f-d31d-d249-14a2-e612f08535f2/23UM1IM35706.rgb.jpg/600x600bb.jpg', previewUrl: 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview126/v4/e5/cd/02/e5cd0244-15c2-491d-a46c-c9f280a316a3/mzaf_8497645062569234850.plus.aac.p.m4a' },
      { id: '5', title: 'Classy 101', artist: 'Feid & Young Miko', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/31/6a/e0/316ae0b0-2101-7fa1-32eb-00b8e62d4dd6/23UM1IM05232.rgb.jpg/600x600bb.jpg', previewUrl: 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview126/v4/c6/16/8c/c6168ce7-0624-a551-fb1f-ce037c8cb1e3/mzaf_3991280327394336109.plus.aac.p.m4a' }
    ];

    const topArtistasData = [
      { name: 'Bad Bunny', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/bf/16/d6/bf16d6c3-1f19-9154-1a3b-24b553e1bf2c/197188981440.jpg/600x600bb.jpg' },
      { name: 'Feid', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/13/be/05/13be059f-d31d-d249-14a2-e612f08535f2/23UM1IM35706.rgb.jpg/600x600bb.jpg' },
      { name: 'Quevedo', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/6d/2c/18/6d2c18df-e53b-e0fa-9869-79f977c08b5f/8445162816911.jpg/600x600bb.jpg' },
      { name: 'LALION', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/bc/2d/a8/bc2da82b-91f1-3038-0a6f-f28328c71a32/197188373726.jpg/600x600bb.jpg' },
      { name: 'Myke Towers', cover: 'https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/64/73/4f/64734f19-33b8-68f7-7b69-f81d1131c19b/190296238803.jpg/600x600bb.jpg' }
    ];

    let miPlaylist = JSON.parse(localStorage.getItem('carlosv8_playlist')) || [];

    function actualizarContador() {
      document.getElementById('countPlaylist').innerText = miPlaylist.length;
    }

    function crearCartaCancion(s, esPlaylist = false) {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => reproducir(s.title, s.artist, s.cover, s.previewUrl);

      const btn = document.createElement('button');
      btn.className = 'add-btn';
      
      if (esPlaylist) {
        btn.innerHTML = '🗑️';
        btn.title = 'Quitar de mi lista';
        btn.onclick = (e) => {
          e.stopPropagation();
          eliminarDePlaylist(s.id);
        };
      } else {
        btn.innerHTML = '＋';
        btn.title = 'Añadir a mi lista';
        btn.onclick = (e) => {
          e.stopPropagation();
          agregarAPlaylist(s);
        };
      }

      const img = document.createElement('img');
      img.src = s.cover;
      img.referrerPolicy = 'no-referrer';

      const titleDiv = document.createElement('div');
      titleDiv.className = 'card-title';
      titleDiv.innerText = s.title;

      const subDiv = document.createElement('div');
      subDiv.className = 'card-sub';
      subDiv.innerText = s.artist;

      card.appendChild(btn);
      card.appendChild(img);
      card.appendChild(titleDiv);
      card.appendChild(subDiv);

      return card;
    }

    function renderizarCanciones(lista, contenedorId, esPlaylist = false) {
      const container = document.getElementById(contenedorId);
      container.innerHTML = '';
      lista.forEach(s => {
        container.appendChild(crearCartaCancion(s, esPlaylist));
      });
    }

    function renderizarArtistas() {
      const container = document.getElementById('gridArtistas');
      container.innerHTML = '';
      topArtistasData.forEach(a => {
        const card = document.createElement('div');
        card.className = 'card artist-card';
        card.onclick = () => {
          document.getElementById('searchInput').value = a.name;
          buscar();
        };
        card.innerHTML = `
          <img src="${a.cover}" referrerpolicy="no-referrer">
          <div class="card-title" style="text-align:center;">${a.name}</div>
          <div class="card-sub" style="text-align:center;">Artista Top</div>
        `;
        container.appendChild(card);
      });
    }

    function agregarAPlaylist(s) {
      if (!miPlaylist.some(item => item.id === s.id)) {
        miPlaylist.push(s);
        localStorage.setItem('carlosv8_playlist', JSON.stringify(miPlaylist));
        actualizarContador();
        alert(`"${s.title}" guardada en tu Playlist`);
      } else {
        alert('Esta canción ya está en tu lista.');
      }
    }

    function eliminarDePlaylist(id) {
      miPlaylist = miPlaylist.filter(item => item.id !== id);
      localStorage.setItem('carlosv8_playlist', JSON.stringify(miPlaylist));
      actualizarContador();
      mostrarSeccion('mi-lista');
    }

    async function buscar() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;

      document.getElementById('tituloPrincipal').innerText = `Resultados para "${q}"`;
      document.getElementById('tituloArtistas').style.display = 'none';
      document.getElementById('gridArtistas').innerHTML = '';
      const grid = document.getElementById('gridCanciones');
      grid.innerHTML = '<p style="color:#aaa;">Buscando música...</p>';

      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&limit=24`);
        if (!res.ok) throw new Error('Error al buscar');
        const data = await res.json();

        grid.innerHTML = '';
        if (!data.results || data.results.length === 0) {
          grid.innerHTML = '<p style="color:#aaa;">No se encontraron resultados para esta búsqueda.</p>';
          return;
        }

        data.results.forEach(item => {
          const song = {
            id: item.trackId ? item.trackId.toString() : String(Math.random()),
            title: item.trackName || 'Sin título',
            artist: item.artistName || 'Artista desconocido',
            cover: item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '600x600bb') : 'https://via.placeholder.com/150/282828/ffffff?text=V8',
            previewUrl: item.previewUrl
          };
          grid.appendChild(crearCartaCancion(song, false));
        });
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<p style="color:#aaa;">Ocurrió un problema de conexión. Vuelve a intentarlo.</p>';
      }
    }

    function reproducir(title, artist, cover, previewUrl) {
      document.getElementById('title').innerText = title;
      document.getElementById('artist').innerText = artist;
      document.getElementById('coverContainer').innerHTML = `<img src="${cover}" referrerpolicy="no-referrer">`;

      const player = document.getElementById('audioPlayer');
      if (previewUrl) {
        player.src = previewUrl;
        player.play().catch(() => {});
      } else {
        alert('Esta pista no dispone de reproducción de audio directa.');
      }
    }

    function mostrarSeccion(seccion) {
      const tituloArtistas = document.getElementById('tituloArtistas');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      if (seccion === 'inicio' || seccion === 'top-canciones') {
        document.getElementById('btn-' + seccion).classList.add('active');
        document.getElementById('tituloPrincipal').innerText = '🔥 Canciones Tops';
        tituloArtistas.style.display = 'block';
        renderizarCanciones(topCancionesData, 'gridCanciones');
        renderizarArtistas();
      } else if (seccion === 'top-artistas') {
        document.getElementById('btn-top-artistas').classList.add('active');
        document.getElementById('tituloPrincipal').innerText = '🎤 Artistas Tops';
        document.getElementById('gridCanciones').innerHTML = '';
        tituloArtistas.style.display = 'none';
        renderizarArtistas();
      } else if (seccion === 'mi-lista') {
        document.getElementById('btn-mi-lista').classList.add('active');
        document.getElementById('tituloPrincipal').innerText = '➕ Mi Playlist';
        tituloArtistas.style.display = 'none';
        if (miPlaylist.length === 0) {
          document.getElementById('gridCanciones').innerHTML = '<p style="color:#aaa;">Tu lista está vacía. Añade canciones pulsando el botón ＋ sobre cualquier tarjeta.</p>';
        } else {
          renderizarCanciones(miPlaylist, 'gridCanciones', true);
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderizarCanciones(topCancionesData, 'gridCanciones');
      renderizarArtistas();
      actualizarContador();
    });
  </script>
</body>
</html>
